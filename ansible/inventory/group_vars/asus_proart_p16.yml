# ansible/inventory/group_vars/asus_proart_p16.yml
# =============================================================================
# ASUS ProArt P16 — Hardware & Power Stack
# All vars here override all.yml defaults for this host group only.
# =============================================================================

# ── Hardware Identity ─────────────────────────────────────────
hardware_vendor: "asus"
form_factor: "laptop"

# ── NPU ───────────────────────────────────────────────────────────────────────
npu:
  enabled: true
  vendor: "amd"
  family: "xdna2"       # xdna2 = Ryzen AI 300 series (Strix Point / Krackan)
  driver: "amdxdna"     # kernel module name

# ── Power Stack ───────────────────────────────────────────────
# Change this line to switch power experiments.
power_stack_profile: "tuned_only"
tuned_active_profile: "balanced"
asus_power_profile: "Balanced"      # Balanced | Performance | Quiet

# ── GPU ───────────────────────────────────────────────────────
# integrated = dGPU suspended. Current known-good state.
# Only change if power_stack_profile: full_asus
gpu_mode: "integrated"

# ── Lemonade Server ───────────────────────────────────────────
# Enabled after flm validate confirmed NPU is live (2026-06-20).
lemonade:
  enabled: true
  port: 8000

# ── llama.cpp ─────────────────────────────────────────────────
# Defaults (vulkan, enabled) are correct for this machine — no override needed.
# To switch to CUDA: set gpu_mode: nvidia, configure NVIDIA CUDA repo, then add:
#   llama_cpp: { enabled: true, backend: "cuda", repo: ..., version: ...,
#                src_dir: ..., build_dir: ..., install_prefix: ..., cuda_architectures: "86" }
# NOTE: must repeat ALL keys — Ansible dict vars replace, not merge.

# ── Console / TTY ─────────────────────────────────────────────
# ProArt P16 is 3840x2400 — default Terminus 16px is unreadably tiny.
# ter-v32b = 32pt bold, the right size for 4K @ 16".
rabble_console_font: "ter-v32b"

# GRUB *menu* at logical 1920x1200 so theme fonts are readable on the 4K panel.
rabble_gfx_mode: "1920x1200x32"

# GFXPAYLOAD = the framebuffer handed to the kernel / simpledrm / Plymouth. It does
# NOT have to match the GRUB menu mode above. It MUST be the panel's NATIVE 3840x2400.
#
# Root cause of the GRUB→Plymouth "black pane over 75% of the screen" (S153, confirmed
# via dmesg): with GFXPAYLOAD=keep the kernel inherited the 1920x1200 menu mode, so
# simpledrm came up at 1920x1200 and was painted 1:1 in the top-LEFT QUARTER of the 4K
# panel (1920x1200 is exactly 1/4 the area of 3840x2400) — leaving 75% black with the
# liminal bg visible in the quarter — until amdgpu KMS switched to native ~3s later.
# A native payload makes simpledrm fill the panel AND removes the mid-boot resolution
# switch (simpledrm 4K → amdgpu 4K, no change). ⚠ UNVERIFIED — reboot-test this.
# NOTE: Plymouth then renders at 4K; entity/wordmark PNGs look small until their
# capture resolution is bumped in build-assets.sh (separate visual-polish follow-up).
rabble_grub_gfxpayload: "3840x2400x32"

# ── Boot / Plymouth ───────────────────────────────────────────
# fbcon=font:TER16x32: loads Terminus 16x32 kernel font for TTYs early,
#   before vconsole setup — fixes tiny TTY font until fbcon reset.
# vt.global_cursor_default=0: hides the blinking text cursor between GRUB and Plymouth.
# rd.driver.blacklist=nvidia: defers NVIDIA dGPU from initramfs so it doesn't
#   trigger a DRM reset mid-boot (was causing black flash). The dGPU is a
#   PRIME-offload/compute device (AMD 890M drives display), so it is loaded off the
#   boot critical path by nvidia-load.service after sddm.service — see
#   roles/hardware/x64/asus_proart_p16/tasks/nvidia.yml.
# plymouth.use-simpledrm removed: amdgpu is forced into the initramfs via the dracut
#   conf in roles/boot/plymouth/tasks/config.yml (add_drivers+=" amdgpu "), so Plymouth
#   uses native AMD KMS from frame one — no simpledrm→KMS handoff flash.
#   ⚠ UNVERIFIED on real hardware — confirm via the boot-chain verification recipe
#   (RaBbLE-Grimoire/RaBbLE-OS/fix/RaBbLE-OS-Fix-BootChain.md) before trusting.
# rd.udev.log_level=3: suppresses initrd udev noise before Plymouth takes over.
rabble_grub_extra_cmdline: >-
  fbcon=font:TER16x32
  vt.global_cursor_default=0
  rd.driver.blacklist=nvidia
  rd.udev.log_level=3
