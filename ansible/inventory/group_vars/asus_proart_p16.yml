# ansible/inventory/group_vars/asus_proart_p16.yml
# =============================================================================
# ASUS ProArt P16 — Hardware & Power Stack
# All vars here override all.yml defaults for this host group only.
# =============================================================================

# ── Hardware Identity ─────────────────────────────────────────
hardware_vendor: "asus"
form_factor: "laptop"

# ── NPU ───────────────────────────────────────────────────────────────────────
npu:
  enabled: true
  vendor: "amd"
  family: "xdna2"       # xdna2 = Ryzen AI 300 series (Strix Point / Krackan)
  driver: "amdxdna"     # kernel module name

# ── Power Stack ───────────────────────────────────────────────
# Change this line to switch power experiments.
power_stack_profile: "tuned_only"
tuned_active_profile: "balanced"
asus_power_profile: "Balanced"      # Balanced | Performance | Quiet

# ── GPU ───────────────────────────────────────────────────────
# integrated = dGPU suspended. Current known-good state.
# Only change if power_stack_profile: full_asus
gpu_mode: "integrated"

# ── Lemonade Server ───────────────────────────────────────────
# Enabled after flm validate confirmed NPU is live (2026-06-20).
lemonade:
  enabled: true
  port: 8000

# ── llama.cpp ─────────────────────────────────────────────────
# Defaults (vulkan, enabled) are correct for this machine — no override needed.
# To switch to CUDA: set gpu_mode: nvidia, configure NVIDIA CUDA repo, then add:
#   llama_cpp: { enabled: true, backend: "cuda", repo: ..., version: ...,
#                src_dir: ..., build_dir: ..., install_prefix: ..., cuda_architectures: "86" }
# NOTE: must repeat ALL keys — Ansible dict vars replace, not merge.

# ── Console / TTY ─────────────────────────────────────────────
# ProArt P16 is 3840x2400 — default Terminus 16px is unreadably tiny.
# ter-v32b = 32pt bold, the right size for 4K @ 16".
rabble_console_font: "ter-v32b"

# GRUB *menu* at native 4K so gfxmode matches GFXPAYLOAD — no mode-switch black flash.
# HiDPI fonts (rabble_grub_theme_*) are doubled below to keep physical text size the same.
# Fallback list: if GOP doesn't expose 3840x2400 the 1920x1200 mode still works.
rabble_gfx_mode: "3840x2400x32,1920x1200x32,auto"
rabble_grub_font_base_size: 32
rabble_grub_theme_hint:  24
rabble_grub_theme_body:  32
rabble_grub_theme_sub:   36
rabble_grub_theme_title: 72

# GFXPAYLOAD = the framebuffer handed to the kernel / simpledrm / Plymouth. It does
# NOT have to match the GRUB menu mode above. It MUST be the panel's NATIVE 3840x2400.
#
# Root cause of the GRUB→Plymouth "black pane over 75% of the screen" (S153, confirmed
# via dmesg): with GFXPAYLOAD=keep the kernel inherited the 1920x1200 menu mode, so
# simpledrm came up at 1920x1200 and was painted 1:1 in the top-LEFT QUARTER of the 4K
# panel (1920x1200 is exactly 1/4 the area of 3840x2400) — leaving 75% black with the
# liminal bg visible in the quarter — until amdgpu KMS switched to native ~3s later.
# A native payload makes simpledrm fill the panel AND removes the mid-boot resolution
# switch (simpledrm 4K → amdgpu 4K, no change). ⚠ UNVERIFIED — reboot-test this.
# NOTE: Plymouth then renders at 4K; entity/wordmark PNGs look small until their
# capture resolution is bumped in build-assets.sh (separate visual-polish follow-up).
rabble_grub_gfxpayload: "3840x2400x32"

# ── Boot / Plymouth ───────────────────────────────────────────
# fbcon=font:TER16x32: loads Terminus 16x32 kernel font for TTYs early,
#   before vconsole setup — fixes tiny TTY font until fbcon reset.
# vt.global_cursor_default=0: hides the blinking text cursor between GRUB and Plymouth.
# rd.driver.blacklist=nvidia: defers NVIDIA dGPU from initramfs so it doesn't
#   trigger a DRM reset mid-boot. AMD 890M drives eDP all the way into Hyprland;
#   NVIDIA is PRIME-offload/compute only, loaded by nvidia-load.service after SDDM.
#   See roles/hardware/x64/asus_proart_p16/tasks/nvidia.yml.
# rd.udev.log_level=3: suppresses initrd udev noise before Plymouth takes over.
# initcall_blacklist=simpledrm_platform_driver_init: the REAL fix for the mid-Plymouth
#   black flash + "accelerated" catch-up. Disproven first; here is the evidence chain.
#
#   ⚠ amdgpu.seamless=1 — REMOVED (S172). It does NOTHING on this silicon. Direct disproof
#   from a clean boot (RaBbLE-BaBbLE/tmp/boot-grub-probe.txt, dmesg monotonic):
#     [1.705] simpledrm up @ native 4K (console 480x150 = 3840x2400 @ 8x16)
#     [4.174] amdgpu begins KMS modeset
#     [4.233] Console: switching to colour DUMMY device 80x25   ← THE BLACK (CRTC dropped)
#     [4.583] Console: switching to amdgpudrmfb 480x150         ← amdgpu fb up
#   With seamless=1 loaded (/sys/module/amdgpu/parameters/seamless == 1) amdgpu logs NO
#   seamless decision and STILL drops to the dummy device. The S167 "confirmed working"
#   note was a false positive. Seamless boot is unimplemented/ineffective for DCN 3.5
#   (Ryzen AI 9 HX 370 / Radeon 890M) on kernel 7.0.x. Do NOT re-add it.
#
#   Root cause: TWO DRM devices come up in sequence — simpledrm (EFI fb, instant, T+1.7)
#   then amdgpu (T+4.2, after ~2.5s of DMUB/PSP/VBIOS firmware load). Plymouth draws on
#   simpledrm, then must MIGRATE to amdgpu when it appears; the CRTC blanks during amdgpu's
#   modeset (the dummy switch) → ~1-2s visible black, and the tick-based splash animation
#   snaps forward on recovery because boot kept progressing during the freeze.
#
#   Fix: don't let simpledrm come up at all. simpledrm is BUILT-IN (modules.builtin), so it
#   can't be modprobe-blacklisted — initcall_blacklist disables its platform-driver init.
#   Then amdgpu is the ONLY DRM device: no second device, no migration, no dummy switch.
#   The GOP framebuffer (GRUB's last 4K frame) holds statically from GRUB hand-off until
#   amdgpu+Plymouth start fresh (~T+4.2) and animate once, cleanly, into SDDM.
#   TRADE-OFF: Plymouth starts ~2.5s later (static hold up front) instead of starting on
#   simpledrm and then blacking out. Net: no flash, no speed-jump — but a longer still frame.
#   REVERT: drop the initcall_blacklist token below and reboot; simpledrm returns.
#
# ⚠ plymouth.use-simpledrm=1 — also REMOVED (S165). The OPPOSITE pin (lock Plymouth TO
#   simpledrm) caused a permanent black because amdgpu's modeset kills the simpledrm scanout
#   while Plymouth keeps drawing to it. Suppressing simpledrm entirely (above) avoids both
#   failure modes. amdgpu is force-loaded into the initramfs (dracut: add_drivers+=amdgpu).
rabble_grub_extra_cmdline: >-
  fbcon=font:TER16x32
  vt.global_cursor_default=0
  rd.driver.blacklist=nvidia
  rd.udev.log_level=3
  initcall_blacklist=simpledrm_platform_driver_init
