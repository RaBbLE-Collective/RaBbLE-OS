# ansible/inventory/hosts.yml
# =============================================================================
# RaBbLE Host Inventory
# =============================================================================
# For local deployment, localhost is used.
# To deploy to a remote machine, add it under the appropriate group.
# =============================================================================
all:
  children:
    # -------------------------------------------------------------------------
    # x64 targets
    # -------------------------------------------------------------------------
    x64:
      # localhost is NOT statically assigned a hardware group. site.yml's
      # "Hardware detection" play reads DMI (ansible_product_name) and adds it to
      # asus_proart_p16 or generic_x64 at run time (fixes B-15). Override with
      # -e rabble_hardware=<group>.
      hosts:
        localhost:
          ansible_connection: local
          ansible_user: "{{ lookup('env', 'USER') }}"
          ansible_python_interpreter: /usr/bin/python3
          ansible_pipelining: false
      children:
        asus_proart_p16:
          hosts: {}
        generic_x64:
          hosts: {}
    # -------------------------------------------------------------------------
    # aarch64 targets
    # -------------------------------------------------------------------------
    aarch64:
      children:
        sbc_0:
          hosts: {}
  # Global vars (overridden by group_vars and host_vars)
  vars:
    rabble_repo_root: "{{ playbook_dir | dirname }}"