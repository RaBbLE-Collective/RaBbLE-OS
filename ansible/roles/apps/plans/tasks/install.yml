---
# apps/plans/tasks/install.yml
# Scaffold the Agent-Native Plan app (MIT) into /opt/rabble/plans and build it.

- name: plans | install pnpm globally
  community.general.npm:
    name: pnpm
    global: true
    state: present
  become: true
  tags: [plans, install, packages]

# Create the parent dir only — the scaffold command creates plans_install_dir itself.
- name: plans | create parent directory for install
  ansible.builtin.file:
    path: "{{ plans_install_dir | dirname }}"
    state: directory
    owner: "{{ plans_user }}"
    group: "{{ plans_user }}"
    mode: "0755"
  become: true
  tags: [plans, install]

# Scaffold only when the app hasn't been created yet (idempotent by checking package.json).
- name: plans | check if app is already scaffolded
  ansible.builtin.stat:
    path: "{{ plans_install_dir }}/package.json"
  register: _plans_scaffold
  tags: [plans, install]

# Remove incomplete scaffold dir (e.g. left by a failed prior run) so create can proceed.
# Safe: only runs when package.json is absent, meaning scaffold never completed.
- name: plans | remove incomplete scaffold dir if present
  ansible.builtin.file:
    path: "{{ plans_install_dir }}"
    state: absent
  become: true
  when: not _plans_scaffold.stat.exists
  tags: [plans, install]

# `create .` fails — the CLI requires a valid package name (not ".").
# Run from the parent dir with the basename of plans_install_dir as the project name.
- name: plans | scaffold Agent-Native Plan template
  ansible.builtin.command:
    cmd: >
      npx --yes @agent-native/core@latest create {{ plans_install_dir | basename }}
      --standalone --template plan --no-git --skip-install
    chdir: "{{ plans_install_dir | dirname }}"
  become: false
  when: not _plans_scaffold.stat.exists
  tags: [plans, install]

- name: plans | install dependencies (pnpm install)
  ansible.builtin.command:
    cmd: pnpm install --frozen-lockfile
    chdir: "{{ plans_install_dir }}"
  become: false
  environment:
    NODE_ENV: production
  when: not _plans_scaffold.stat.exists
  tags: [plans, install]

- name: plans | build the app
  ansible.builtin.command:
    cmd: pnpm build
    chdir: "{{ plans_install_dir }}"
  become: false
  environment:
    NODE_ENV: production
  when: not _plans_scaffold.stat.exists
  tags: [plans, install]
