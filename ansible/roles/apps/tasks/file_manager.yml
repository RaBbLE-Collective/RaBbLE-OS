---
# apps/tasks/file_manager.yml — yazi (primary TUI FM) + dolphin (GUI bridge)

- name: file_manager | create yazi config directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/yazi"
    state: directory
    mode: '0755'
  tags: [apps, filemanager, yazi]

- name: file_manager | deploy yazi dotfiles
  ansible.builtin.copy:
    src: "{{ dotfiles_repo_root }}/config/yazi/{{ item }}"
    dest: "{{ ansible_env.HOME }}/.config/yazi/{{ item }}"
    mode: '0644'
  loop:
    - yazi.toml
    - theme.toml
    - keymap.toml
    - init.lua
  tags: [apps, filemanager, yazi]

- name: file_manager | install yazi plugins (includes git)
  ansible.builtin.git:
    repo: https://github.com/yazi-rs/plugins
    dest: "{{ rabble_home }}/.local/share/yazi/packages/yazi-rs/plugins"
    depth: 1
    update: false
  become: false
  tags: [apps, filemanager, yazi]

