---
# ai-harnesses/tasks/main.yml
# Installs AI coding agents and LLM CLI tools for the sCoRE local AI layer.
# Runs as the target user (become: false in site.yml play).

- { ansible.builtin.include_tasks: claude-code.yml, tags: [ai-harnesses, claude-code], when: ai_harnesses_claude_code_enabled }
- { ansible.builtin.include_tasks: codex.yml,       tags: [ai-harnesses, codex],       when: ai_harnesses_codex_enabled }
- { ansible.builtin.include_tasks: opencode.yml,    tags: [ai-harnesses, opencode],    when: ai_harnesses_opencode_enabled }
- { ansible.builtin.include_tasks: aider.yml,       tags: [ai-harnesses, aider],       when: ai_harnesses_aider_enabled }
- { ansible.builtin.include_tasks: gemini-cli.yml,  tags: [ai-harnesses, gemini-cli],  when: ai_harnesses_gemini_cli_enabled }
- { ansible.builtin.include_tasks: ollama.yml,      tags: [ai-harnesses, ollama],      when: ai_harnesses_ollama_enabled }
- { ansible.builtin.include_tasks: vllm.yml,              tags: [ai-harnesses, vllm],              when: ai_harnesses_vllm_enabled }
- { ansible.builtin.include_tasks: free-claude-code.yml,  tags: [ai-harnesses, free-claude-code],  when: ai_harnesses_fcc_enabled }
- { ansible.builtin.include_tasks: builder-skills.yml,    tags: [ai-harnesses, builder-skills],    when: ai_harnesses_builder_skills_enabled }
