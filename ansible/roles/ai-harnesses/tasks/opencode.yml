---
# opencode — TUI AI coding assistant (multi-provider, Aider-like UX)
# Auth: delegates to provider env vars (OPENAI_API_KEY, ANTHROPIC_API_KEY, etc.)
# sCoRE provider: opencode (subprocess, `opencode run --print` mode)

- name: Install opencode globally via npm (latest — reinstalls if missing or outdated)
  community.general.npm:
    name: "opencode-ai"
    global: true
    state: latest
  environment:
    NPM_CONFIG_PREFIX: "{{ ai_harnesses_node_prefix }}"

- name: Verify opencode binary is reachable
  ansible.builtin.command: opencode --version
  register: _opencode_version
  changed_when: false
  failed_when: false

- name: Report opencode version
  ansible.builtin.debug:
    msg: "opencode: {{ _opencode_version.stdout | default('NOT FOUND — npm install may have failed or PATH is missing ~/.local/bin') }}"

- name: Warn if opencode binary is missing after install
  ansible.builtin.fail:
    msg: >
      opencode installed but binary not found in PATH.
      Run: export PATH="$HOME/.local/bin:$PATH"
      Or check: ls ~/.local/bin/opencode
  when: _opencode_version.rc != 0
