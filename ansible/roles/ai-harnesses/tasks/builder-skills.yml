---
# Agent-Native skills — quick-recap only
#
# visual-plan and visual-recap were removed (S157): they route to agent-native/BuilderIO
# hosted servers and the visual render is RaBbLE's job (NeBuLA/World, EP2 target).
# See: RaBbLE-Grimoire/RaBbLE-Agent/RaBbLE-VisualPlan-Protocol.md
#
# quick-recap is kept: it provides the session status block convention (🟢/🟡/🔴)
# used across all RaBbLE agent sessions. No hosted dependency.

- name: Ensure Claude Code global skills directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.claude/skills"
    state: directory
    mode: '0755'

- name: Install quick-recap skill via npx
  ansible.builtin.command: >
    npx --yes @agent-native/skills@latest add
    --skill quick-recap
    --scope user
    --client claude-code
    --yes
    --no-connect
  environment:
    HOME: "{{ lookup('env', 'HOME') }}"
    PATH: "{{ lookup('env', 'PATH') }}:{{ lookup('env', 'HOME') }}/.local/bin"
  register: _skills_install
  changed_when: "'already installed' not in (_skills_install.stdout | default(''))"
  failed_when: _skills_install.rc != 0

- name: Remove visual-plan skill if present (archived S157)
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.claude/skills/visual-plan"
    state: absent

- name: Remove visual-recap skill if present (archived S157)
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.claude/skills/visual-recap"
    state: absent

- name: Report skills install
  ansible.builtin.debug:
    msg: "skills: {{ _skills_install.stdout_lines | default(['install output not captured']) }}"
