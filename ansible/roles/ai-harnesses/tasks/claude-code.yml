---
# Claude Code CLI — Anthropic's official agentic coding assistant
# Auth: `claude` picks up existing browser/OAuth session or ANTHROPIC_API_KEY.
# sCoRE provider: claude_code (subprocess, --print mode)
#
# Idempotency: if `claude` is already reachable in PATH (any install method),
# skip the npm install to avoid EEXIST conflicts with pre-existing binaries.

- name: Check if Claude Code is already installed
  ansible.builtin.command: claude --version
  register: _claude_precheck
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ai_harnesses_node_prefix }}/bin:{{ ansible_env.PATH }}"

- name: Install Claude Code CLI globally via npm
  community.general.npm:
    name: "@anthropic-ai/claude-code"
    global: true
    state: present
  environment:
    NPM_CONFIG_PREFIX: "{{ ai_harnesses_node_prefix }}"
  when: _claude_precheck.rc != 0

- name: Verify claude binary is reachable
  ansible.builtin.command: claude --version
  register: _claude_version
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ai_harnesses_node_prefix }}/bin:{{ ansible_env.PATH }}"

- name: Report Claude Code version
  ansible.builtin.debug:
    msg: "Claude Code: {{ _claude_version.stdout | default('not found — check PATH and NPM_CONFIG_PREFIX') }}"

# rabble: Claude Code as RaBbLE with the Crew as agent-team organs (sCoRE crew/rabble.py,
# S273). Linked only when the sCoRE member is cloned inside the Collective.
- name: Check for the sCoRE rabble launcher
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/RaBbLE-Collective/RaBbLE-sCoRE/scripts/rabble"
  register: _rabble_launcher

- name: Check what ~/.local/bin/rabble is now
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.local/bin/rabble"
    follow: false
  register: _rabble_dest

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/bin"
    state: directory
    mode: '0755'
  when: _rabble_launcher.stat.exists

# Replaces an existing symlink, never a real file (the future L-09 CLI shares the name;
# per RaBbLE-sCoRE-Crew.md C2 it extends crew/rabble.py rather than installing its own binary).
- name: Link rabble launcher into ~/.local/bin
  ansible.builtin.file:
    src: "{{ lookup('env', 'HOME') }}/RaBbLE-Collective/RaBbLE-sCoRE/scripts/rabble"
    dest: "{{ lookup('env', 'HOME') }}/.local/bin/rabble"
    state: link
    force: true
  when: _rabble_launcher.stat.exists and (not _rabble_dest.stat.exists or _rabble_dest.stat.islnk)

- name: Report a non-link ~/.local/bin/rabble left in place
  ansible.builtin.debug:
    msg: "~/.local/bin/rabble is a real file, not replaced; remove it to install the Crew launcher"
  when: _rabble_launcher.stat.exists and _rabble_dest.stat.exists and not _rabble_dest.stat.islnk

# RaBbLE-UI venv: `rabble`'s own Textual face over a headless Claude Code (sCoRE ui/ +
# orchestra/, plan log/plans/sCoRE-RaBbLE-UI-Plan.md). Pins live in sCoRE ui/requirements.txt;
# scripts/rabble runs this venv's python. Built only when sCoRE is cloned.
- name: Check for the RaBbLE-UI requirements
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/RaBbLE-Collective/RaBbLE-sCoRE/ui/requirements.txt"
  register: _rabble_ui_reqs

- name: Ensure uv (Python package manager) is installed
  ansible.builtin.shell: |
    curl -LsSf https://astral.sh/uv/install.sh | sh
  args:
    creates: "{{ lookup('env', 'HOME') }}/.local/bin/uv"
  when: _rabble_ui_reqs.stat.exists

- name: Create the RaBbLE-UI venv
  ansible.builtin.command: >
    {{ lookup('env', 'HOME') }}/.local/bin/uv venv --python 3.14
    {{ lookup('env', 'HOME') }}/.local/share/RaBbLE/rabble-ui
  args:
    creates: "{{ lookup('env', 'HOME') }}/.local/share/RaBbLE/rabble-ui/bin/python"
  when: _rabble_ui_reqs.stat.exists

- name: Install RaBbLE-UI dependencies into the venv
  ansible.builtin.command: >
    {{ lookup('env', 'HOME') }}/.local/bin/uv pip install
    --python {{ lookup('env', 'HOME') }}/.local/share/RaBbLE/rabble-ui/bin/python
    -r {{ lookup('env', 'HOME') }}/RaBbLE-Collective/RaBbLE-sCoRE/ui/requirements.txt
  register: _rabble_ui_install
  changed_when: "'Installed' in _rabble_ui_install.stderr or 'Uninstalled' in _rabble_ui_install.stderr"
  when: _rabble_ui_reqs.stat.exists
