---
# ansible/roles/layer/containers/tasks/main.yml
# spark ~ layer/containers >> Docker + Podman container runtimes // %LAYER_CONTAINERS%
#
# Opt-in layer (rabble_enable_containers, default false — see defaults/main.yml).
# Docker CE (rootful daemon, docker-compose.yml compatibility for tools that
# assume real Docker) and Podman (rootless, daemonless) installed side by
# side — different tradeoffs, pick per-project. Not podman-docker: that
# package aliases /usr/bin/docker to podman, which would fight the real
# docker-ce binary installed here.

- name: containers | add Docker CE repo
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable - $basearch
    baseurl: https://download.docker.com/linux/fedora/$releasever/$basearch/stable
    gpgcheck: true
    gpgkey: https://download.docker.com/linux/fedora/gpg
    enabled: true
  become: true
  tags: [layer, containers, packages]

- name: containers | install Docker CE
  ansible.builtin.dnf:
    name: "{{ containers_docker_packages }}"
    state: present
  become: true
  tags: [layer, containers, packages]

- name: containers | install Podman
  ansible.builtin.dnf:
    name: "{{ containers_podman_packages }}"
    state: present
  become: true
  tags: [layer, containers, packages]

- name: containers | add user to docker group (CLI access without sudo)
  ansible.builtin.user:
    name: "{{ rabble_user }}"
    groups: docker
    append: true
  become: true
  tags: [layer, containers, packages]
  # Group membership requires a new login session to take effect.

- name: containers | enable docker.socket (lazy daemon start on first use)
  ansible.builtin.systemd:
    name: docker.socket
    enabled: true
    state: started
  become: true
  tags: [layer, containers, config]
  # Socket-activated rather than enabling docker.service directly — the
  # daemon only spins up when something actually connects, keeping it off
  # the always-on boot set (local-first: no background daemon by default).
