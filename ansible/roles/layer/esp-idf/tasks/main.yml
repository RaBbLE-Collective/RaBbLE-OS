---
# ansible/roles/layer/esp-idf/tasks/main.yml
# spark ~ layer/esp-idf >> Espressif ESP-IDF toolchain(s) (RaBbLE-Pocket firmware) // %LAYER_ESP_IDF%
#
# Opt-in layer (rabble_enable_esp_idf, default false — see defaults/main.yml).
# System prerequisites come from dnf; ESP-IDF itself is not a Fedora package —
# cloned from Espressif's repo and installed into the user's home via its own
# install.sh (self-contained Python venv + cross-compiler toolchain download),
# same shape as the powerlevel10k git-clone in desktop/shell/zsh/tasks/packages.yml.
# See ADR: RaBbLE-Pocket/planning/decisions/2026-08-07-esp-idf-over-arduino.md
#
# Multiple versions (esp_idf_versions list) install side by side, one
# directory each — Espressif's own toolchain/venv caches under ~/.espressif/
# are already keyed by version, so this never collides. Picking which one a
# given firmware project actually uses is handled at the project level —
# RaBbLE-Pocket/ops/esp-idf-select.sh — not here.

- name: esp-idf | install system prerequisites
  ansible.builtin.dnf:
    name: "{{ esp_idf_prereq_packages }}"
    state: present
  become: true
  tags: [layer, esp-idf, packages]

- name: esp-idf | install broader embedded-dev tools
  ansible.builtin.dnf:
    name: "{{ esp_idf_extra_packages }}"
    state: present
  become: true
  tags: [layer, esp-idf, packages]

- name: esp-idf | add user to dialout group (USB-serial flashing access)
  ansible.builtin.user:
    name: "{{ rabble_user }}"
    groups: dialout
    append: true
  become: true
  tags: [layer, esp-idf, usb-serial]
  # Same rationale as layer/bottles: the board enumerates as /dev/ttyACM* over
  # its native USB; esptool.py (via idf.py flash) needs dialout to open the
  # port without sudo. Group membership requires a new login session.

- name: esp-idf | clone ESP-IDF versions
  ansible.builtin.git:
    repo: https://github.com/espressif/esp-idf.git
    dest: "{{ rabble_home }}/esp/esp-idf-{{ item }}"
    version: "{{ item }}"
    recursive: true
    update: false
  loop: "{{ esp_idf_versions }}"
  become: false
  tags: [layer, esp-idf, packages]
  # become: false explicitly — must clone/own as the regular user, not root;
  # the play this role runs under defaults become: true.

- name: esp-idf | run install.sh for {{ esp_idf_target }} (each version)
  ansible.builtin.shell:
    cmd: "./install.sh {{ esp_idf_target }} && touch .rabble_installed"
    chdir: "{{ rabble_home }}/esp/esp-idf-{{ item }}"
    creates: "{{ rabble_home }}/esp/esp-idf-{{ item }}/.rabble_installed"
  loop: "{{ esp_idf_versions }}"
  become: false
  tags: [layer, esp-idf, packages]
  # Idempotency guard is our own marker file, not export.sh (which already
  # ships in the git checkout before install.sh ever runs — using it as the
  # `creates:` target would skip the actual toolchain/venv install entirely).
  # Marker is per-clone-directory, so each version in the loop is judged
  # independently — one already-installed version never causes another to
  # be skipped.

- name: esp-idf | symlink default version for tooling that expects one path
  ansible.builtin.file:
    src: "{{ rabble_home }}/esp/esp-idf-{{ esp_idf_versions[0] }}"
    dest: "{{ rabble_home }}/esp/esp-idf-default"
    state: link
  become: false
  tags: [layer, esp-idf, packages]
  # esp_idf_versions[0] is the primary/default — esp-idf-select.sh resolves
  # through the project's .esp-idf-version pin first and only falls back to
  # this symlink when a project hasn't pinned one.

# ── EIM GUI — Espressif's own multi-version installer/registry ──────────────
# Not the primary workflow here (esp-idf-select.sh + per-project pin file is)
# — installed because Mark wants every generally-useful official ESP tool
# available, not just the ones RaBbLE-Pocket's own tooling uses day to day.
# Not a dnf-repo package — Espressif ships it as a prebuilt .rpm release
# asset. "latest" release URL used deliberately so this doesn't need a
# pinned version bump here.
#
# GUI only, not GUI+CLI: espressif/idf-im-ui ships eim-cli and eim-gui as
# SEPARATE packages that both install to /usr/bin/eim — confirmed by hash,
# they're genuinely different binaries (32MB vs 51MB, different sha256), so
# dnf refuses to have both installed at once (real file-path conflict, not
# just a hypothetical). Installing the GUI since that's what was asked for;
# swap this task to eim-cli-linux-x64.rpm instead if CLI-only is ever
# preferred over the GUI app.

- name: esp-idf | download EIM GUI (eim-gui) .rpm
  ansible.builtin.get_url:
    url: https://github.com/espressif/idf-im-ui/releases/latest/download/eim-gui-linux-x64.rpm
    dest: /tmp/eim-gui-linux-x64.rpm
    mode: "0644"
    force: true
  become: false
  tags: [layer, esp-idf, packages]

- name: esp-idf | install EIM GUI
  ansible.builtin.dnf:
    name: /tmp/eim-gui-linux-x64.rpm
    state: present
    disable_gpg_check: true
  become: true
  tags: [layer, esp-idf, packages]
  # disable_gpg_check: unsigned third-party release rpm, not from a
  # dnf-managed repo — no GPG key to verify against.
