---
# ansible/roles/layer/esp-idf/tasks/main.yml
# spark ~ layer/esp-idf >> Espressif ESP-IDF toolchain(s) via EIM CLI (RaBbLE-Pocket firmware) // %LAYER_ESP_IDF%
#
# Opt-in layer (rabble_enable_esp_idf, default false — see defaults/main.yml).
# System prerequisites come from dnf; ESP-IDF itself is not a Fedora package.
# Provisioning goes through Espressif's own EIM CLI (`eim install`) rather
# than a hand-rolled git-clone + install.sh loop — EIM is Espressif's
# documented, non-interactive-capable multi-version installer/registry, a
# better fit than reinventing that mechanism ourselves. See ADRs:
#   RaBbLE-Pocket/planning/decisions/2026-08-07-esp-idf-over-arduino.md
#   RaBbLE-Pocket/planning/decisions/2026-08-07-esp-idf-multiversion-and-eim.md
#   RaBbLE-Pocket/planning/decisions/2026-08-08-eim-cli-provisioning.md
#
# Multiple versions (esp_idf_versions list) install side by side, one
# `--version-name` each under a shared --path — EIM's own registry
# (`eim list`, ~/.espressif/tools/eim_idf.json) tracks what's installed.
# Picking which one a given firmware project actually uses is handled at
# the project level — RaBbLE-Pocket/ops/esp-idf-select.sh — not here.
#
# NOTE — first real end-to-end run of this exact flow: `eim install`'s flags
# are all taken from `eim install --help` (verified by extracting the
# binary and running it), but the resulting on-disk layout under
# --path/--version-name was not observed on a live install before writing
# this. esp-idf-select.sh relies on that exact layout
# ({{ esp_idf_eim_path }}/<version>/export.sh) — worth a quick look after
# the first `apply esp-idf` to confirm it matches.

- name: esp-idf | install system prerequisites
  ansible.builtin.dnf:
    name: "{{ esp_idf_prereq_packages }}"
    state: present
  become: true
  tags: [layer, esp-idf, packages]

- name: esp-idf | install broader embedded-dev tools
  ansible.builtin.dnf:
    name: "{{ esp_idf_extra_packages }}"
    state: present
  become: true
  tags: [layer, esp-idf, packages]

- name: esp-idf | add user to dialout group (USB-serial flashing access)
  ansible.builtin.user:
    name: "{{ rabble_user }}"
    groups: dialout
    append: true
  become: true
  tags: [layer, esp-idf, usb-serial]
  # Same rationale as layer/bottles: the board enumerates as /dev/ttyACM* over
  # its native USB; esptool.py (via idf.py flash) needs dialout to open the
  # port without sudo. Group membership requires a new login session.

# ── EIM CLI — Espressif's own multi-version installer/registry ─────────────
# Not a dnf-repo package — Espressif ships it as a prebuilt .rpm release
# asset. "latest" release URL used deliberately so this doesn't need a
# pinned version bump here.
#
# CLI, not GUI: espressif/idf-im-ui ships eim-cli and eim-gui as SEPARATE
# packages that both install to /usr/bin/eim — confirmed by hash, genuinely
# different binaries (32MB vs 51MB, different sha256), so dnf refuses to
# have both installed at once (real file-path conflict). CLI chosen over the
# GUI this installed originally: `eim --help` showed full command parity
# (install/list/select/run/remove/rename/wizard/...) plus scriptability
# (--non-interactive) the GUI doesn't offer, and it's the tool this role
# actually drives below — not just a standalone extra.

- name: esp-idf | download EIM CLI (eim-cli) .rpm
  ansible.builtin.get_url:
    url: https://github.com/espressif/idf-im-ui/releases/latest/download/eim-cli-linux-x64.rpm
    dest: /tmp/eim-cli-linux-x64.rpm
    mode: "0644"
    force: true
  become: false
  tags: [layer, esp-idf, packages]

- name: esp-idf | install EIM CLI
  ansible.builtin.dnf:
    name: /tmp/eim-cli-linux-x64.rpm
    state: present
    disable_gpg_check: true
  become: true
  tags: [layer, esp-idf, packages]
  # disable_gpg_check: unsigned third-party release rpm, not from a
  # dnf-managed repo — no GPG key to verify against.

# ── ESP-IDF versions, via eim install ───────────────────────────────────────

- name: esp-idf | check which versions eim already has registered
  ansible.builtin.command: eim list
  register: esp_idf_eim_list
  changed_when: false
  failed_when: false
  become: false
  tags: [layer, esp-idf, packages]
  # failed_when: false — a fresh eim with nothing installed yet may exit
  # non-zero on `list`; either way esp_idf_eim_list.stdout is what we grep.

- name: esp-idf | install ESP-IDF versions via eim
  ansible.builtin.command:
    cmd: >
      eim install
      --path {{ esp_idf_eim_path }}
      --version-name {{ item }}
      --idf-versions {{ item }}
      --target {{ esp_idf_target }}
      --non-interactive true
      --do-not-track true
  loop: "{{ esp_idf_versions }}"
  when: item not in esp_idf_eim_list.stdout
  become: false
  tags: [layer, esp-idf, packages]
  # Idempotency guard: skip a version already showing up in `eim list`
  # rather than a filesystem `creates:` (eim owns its own registry — no
  # point maintaining a second one just to check "already done").

- name: esp-idf | symlink default version for tooling that expects one path
  ansible.builtin.file:
    src: "{{ esp_idf_eim_path }}/{{ esp_idf_versions[0] }}"
    dest: "{{ rabble_home }}/esp/esp-idf-default"
    state: link
  become: false
  tags: [layer, esp-idf, packages]
  # esp_idf_versions[0] is the primary/default — esp-idf-select.sh resolves
  # through the project's .esp-idf-version pin first and only falls back to
  # this symlink when a project hasn't pinned one.
