---
# ansible/roles/layer/freecad/tasks/main.yml
# spark ~ layer/freecad >> Parametric CAD for creators // %LAYER_FREECAD%
#
# Opt-in layer (rabble_enable_freecad, default false — see defaults/main.yml).
# Not in Fedora's repos (confirmed via dnf search, S207) — installed from
# Flathub same as layer/bottles. First use: RaBbLE-Pocket battery mount
# design (Mark, S207).

- name: freecad | ensure flatpak runtime installed
  ansible.builtin.dnf:
    name: flatpak
    state: present
  become: true
  tags: [layer, freecad, packages]

- name: freecad | ensure Flathub remote is registered (system-wide)
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    method: system
  become: true
  tags: [layer, freecad, packages]

- name: freecad | install FreeCAD
  community.general.flatpak:
    name: org.freecad.FreeCAD
    state: present
    method: system
  become: true
  tags: [layer, freecad, packages]
