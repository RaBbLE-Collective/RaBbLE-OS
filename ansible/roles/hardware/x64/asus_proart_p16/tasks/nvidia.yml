---
# ╔══════════════════════════════════════════════════════════════════╗
# ║  Hardware: NVIDIA RTX 4060 Max-Q Mobile (Optimus/PRIME offload)  ║
# ║                                                                  ║
# ║  ARCHITECTURE NOTE:                                              ║
# ║  This is a laptop MUX setup — the RTX 4060 does NOT drive the   ║
# ║  display in Hybrid mode. The AMD 890M drives Wayland/KMS.        ║
# ║  NVIDIA is used via DRI_PRIME=1 for GPU-intensive workloads      ║
# ║  (LLM inference, rendering, CUDA compute).                       ║
# ║                                                                  ║
# ║  CRITICAL: nouveau is loaded by default on Fedora 43.            ║
# ║  It MUST be blacklisted before akmod-nvidia installation.        ║
# ╚══════════════════════════════════════════════════════════════════╝

# ─── Step 1: Blacklist nouveau ────────────────────────────────────
- name: Blacklist nouveau kernel module
  copy:
    dest: /etc/modprobe.d/blacklist-nouveau.conf
    content: |
      # RaBbLE-OS: Blacklist nouveau to allow akmod-nvidia
      # nouveau conflicts with the proprietary NVIDIA driver
      blacklist nouveau
      options nouveau modeset=0
  notify: regenerate initramfs

- name: Check if nouveau is currently loaded
  command: lsmod
  register: lsmod_check
  changed_when: false

- name: Warn if nouveau is still active (requires reboot after initramfs rebuild)
  debug:
    msg: |
      ⚠️  nouveau is currently loaded in RAM.
      The blacklist takes effect after initramfs rebuild + reboot.
      This playbook will rebuild initramfs — then REBOOT before next run.
  when: "'nouveau' in lsmod_check.stdout"

# ─── Step 1b: nvidia-drm fbdev + modeset (Wayland KMS, required >= driver 545) ──
- name: Set nvidia-drm fbdev=1 and modeset=1 for Wayland framebuffer support
  copy:
    dest: /etc/modprobe.d/rabble-nvidia-wayland.conf
    content: |
      # RaBbLE-OS: NVIDIA Wayland / KMS options
      # fbdev=1 required for proper framebuffer on newer NVIDIA drivers (>= 545)
      # modeset=1 set explicitly here (previously left to supergfxd.conf) — it is a
      # real prerequisite for RTD3/D3cold power management on Wayland, not just KMS.
      options nvidia-drm fbdev=1
      options nvidia-drm modeset=1
  notify: regenerate initramfs

# ─── Step 1c: SDDM greeter GPU pin ───────────────────────────────
# NVIDIA (card0) has no CRTCs in hybrid mode — sway finds no outputs and crashes.
# Pin the SDDM greeter compositor to AMD (card1) so the login screen appears.
- name: Create /etc/sddm.conf.d directory
  file:
    path: /etc/sddm.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Pin SDDM sway greeter to AMD card (card1)
  copy:
    dest: /etc/sddm.conf.d/rabble-gpu.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # RaBbLE-OS: Pin SDDM greeter compositor to AMD card (PCI 0000:65:00.0 via by-path)
      # By-path symlink ensures stability across card renumbering (Phase-2 simpledrm suppression).
      # NVIDIA (card0) has no CRTCs in Optimus hybrid mode — sway compositor crashes without this.
      [Wayland]
      CompositorCommand=env WLR_DRM_DEVICES=/dev/dri/by-path/pci-0000:65:00.0-card /usr/libexec/sddm-compositor-sway

# ─── Step 2: NVIDIA Driver Installation ──────────────────────────
- name: Install akmod-nvidia (auto-rebuilds on kernel updates)
  dnf:
    name:
      - akmod-nvidia              # Kernel module (auto-rebuilds with kmod)
      - xorg-x11-drv-nvidia       # Xorg driver (still needed even on Wayland)
      - xorg-x11-drv-nvidia-cuda  # CUDA support
      - xorg-x11-drv-nvidia-cuda-libs
      - xorg-x11-drv-nvidia-power # Ships nvidia-suspend/-hibernate/-resume/-powerd.service
                                   # + /usr/lib/systemd/system-sleep hooks (D3cold/RTD3 stack)
      - libva-nvidia-driver  # The current Fedora 43 naming convention for Vid Accel
      - libva-utils
    state: present

# ─── Step 2b: NVIDIA runtime power management (D3cold / RTD3) ───────────────
# Requires xorg-x11-drv-nvidia-power (Step 2) for the sleep hooks to have effect.
- name: Set NVIDIA dynamic power management + video memory preservation options
  copy:
    dest: /etc/modprobe.d/rabble-nvidia-powermgmt.conf
    content: |
      # RaBbLE-OS: NVIDIA runtime power management (D3cold / RTD3)
      # NVreg_DynamicPowerManagement=0x02 enables fine-grained RTD3 (D3cold when idle)
      # NVreg_PreserveVideoMemoryAllocations=1 required for suspend/resume to work
      # correctly with dynamic power management enabled.
      options nvidia NVreg_DynamicPowerManagement=0x02
      options nvidia NVreg_PreserveVideoMemoryAllocations=1
  notify: regenerate initramfs

- name: Warn that NVIDIA power management options require a reboot
  debug:
    msg: |
      ⚠️  NVreg_DynamicPowerManagement / NVreg_PreserveVideoMemoryAllocations were
      just written to /etc/modprobe.d/rabble-nvidia-powermgmt.conf.
      Like the nouveau blacklist above, these are modprobe options — they only take
      effect after the initramfs rebuild AND a reboot. Do not assume D3cold/RTD3 is
      live until after that reboot.

# ─── Step 3: Deferred NVIDIA load (boot-chain partner to rd.driver.blacklist=nvidia) ──
# The GRUB cmdline carries `rd.driver.blacklist=nvidia` (group_vars) so the dGPU is
# kept OUT of the initramfs — this removes the mid-boot DRM reset that was flashing
# the Plymouth splash black. AMD (890M) drives KMS/display from frame one.
#
# Because the dGPU is a PRIME-offload / compute device (DRI_PRIME=1, CUDA), it does
# NOT need to be up during boot. This service loads it once the login surface exists,
# so it is ready for offload/compute without ever touching the boot critical path.
# modeset comes from the modprobe.d options above (loading nvidia_drm pulls nvidia +
# nvidia_modeset); nvidia_uvm is loaded explicitly for CUDA.
- name: Deploy nvidia-load.service (load dGPU after the login surface)
  copy:
    dest: /etc/systemd/system/nvidia-load.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # RaBbLE-OS: load the NVIDIA dGPU after SDDM, off the boot critical path.
      # Partner to rd.driver.blacklist=nvidia (deferred from initramfs).
      [Unit]
      Description=RaBbLE-OS — load NVIDIA dGPU for PRIME offload / CUDA after login surface
      After=sddm.service
      Wants=sddm.service
      ConditionPathExists=/usr/sbin/modprobe

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      # nvidia_drm pulls in nvidia + nvidia_modeset; uvm is for CUDA compute.
      ExecStart=-/usr/sbin/modprobe nvidia_drm
      ExecStart=-/usr/sbin/modprobe nvidia_uvm

      [Install]
      WantedBy=graphical.target
  become: true

- name: Enable nvidia-load.service
  ansible.builtin.systemd:
    name: nvidia-load.service
    enabled: true
    daemon_reload: true
    scope: system
  become: true

# ─── Step 4: NVIDIA power-management services (from xorg-x11-drv-nvidia-power) ──
# These units + the /usr/lib/systemd/system-sleep hooks only exist once
# xorg-x11-drv-nvidia-power is installed (Step 2). They save/restore GPU state
# across suspend/hibernate so RTD3/D3cold (Step 2b) survives sleep cycles cleanly.
- name: Enable nvidia-suspend.service
  ansible.builtin.systemd:
    name: nvidia-suspend.service
    enabled: true
    daemon_reload: true
    scope: system
  become: true

- name: Enable nvidia-hibernate.service
  ansible.builtin.systemd:
    name: nvidia-hibernate.service
    enabled: true
    daemon_reload: true
    scope: system
  become: true

- name: Enable nvidia-resume.service
  ansible.builtin.systemd:
    name: nvidia-resume.service
    enabled: true
    daemon_reload: true
    scope: system
  become: true

# nvidia-powerd.service is Dynamic Boost 2.0 — CPU/GPU power-budget arbitration for
# performance/clock boosting under load. It is NOT an idle-power reducer; it does not
# contribute to D3cold idle draw. Enabled here because it's part of the documented
# xorg-x11-drv-nvidia-power stack, not as a claimed fix for idle power.
- name: Enable nvidia-powerd.service (Dynamic Boost 2.0 — perf arbitration, not idle-power)
  ansible.builtin.systemd:
    name: nvidia-powerd.service
    enabled: true
    daemon_reload: true
    scope: system
  become: true

# Deliberately NOT enabling nvidia-persistenced: it holds the GPU in D0 permanently,
# which defeats RTD3/D3cold idle suspend entirely. Anti-pattern for a laptop dGPU.