---
# ansible/roles/hardware/x64/asus_proart_p16/tasks/asusctl.yml
# asusctl — the CLI client for asusd: fan profiles, keyboard backlight,
# charge limit, AuraSync. Source is copr:lukenukem/asus-linux, already
# declared in ansible/packages/manifest.yml — this task installs the client
# and sets the default platform-profile. The daemon service (asusd.service)
# is installed/enabled by asusd.yml; per-profile fan curves live in
# arbitration.yml (Balanced there gets the quiet curve override, not stock).

- name: asusctl | install asusctl client
  ansible.builtin.dnf:
    name: asusctl
    state: present
  become: true
  tags: [hardware, asus, power]

# Syntax CONFIRMED against asusctl 6.3.8-2.fc43 (2026-07-06, live machine):
# subcommand is `profile set <Profile>` (valid profiles: Quiet, Balanced,
# Performance from `asusctl profile list`). The old `-P` flag does not exist on
# this version. `set` also takes -a/--ac and -b/--battery to pin a profile to a
# power source; we set the active default only. failed_when: false is kept as a
# guard in case the daemon is briefly unavailable on first boot.
- name: "asusctl | set default platform-profile ({{ asus_power_profile | default('Balanced') }})"
  ansible.builtin.command: "asusctl profile set {{ asus_power_profile | default('Balanced') }}"
  register: rabble_asusctl_profile_set
  changed_when: rabble_asusctl_profile_set.rc == 0
  failed_when: false
  become: true
  tags: [hardware, asus, power]
