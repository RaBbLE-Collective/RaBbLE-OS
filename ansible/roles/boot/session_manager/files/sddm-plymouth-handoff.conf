# /etc/systemd/system/sddm.service.d/plymouth-handoff.conf
# Deployed by: ansible/roles/boot/session_manager/tasks/config.yml
#
# S207 fix: SDDM greeter intermittently fails to appear after reboot.
#
# The vendor sddm.service is ordered After=plymouth-quit.service, which only
# fires the async "plymouth quit" signal — it does NOT wait for plymouthd to
# actually release DRM master. plymouth-quit-wait.service is the unit that
# blocks until Plymouth is really gone, and nothing orders sddm.service after
# it. Most boots the timing works out by luck; when it doesn't, the greeter's
# sway compositor (pinned to the AMD card — see nvidia.yml Step 1c) does a
# single non-retrying DRM open() and dies instantly:
#   sway: [ERROR] Failed to open device: '/dev/dri/rabble-amdgpu-card': Device or resource busy
#   sway: [ERROR] Unable to open /dev/dri/rabble-amdgpu-card as KMS device
# The greeter session then closes ~1s later and the login screen never
# appears — no way in but a TTY (real-boot evidence: boot journal, S207).
#
# This is independent of the S197 plymouth-quit-sddm.conf retain-splash
# drop-in (which controls what Plymouth leaves on screen, not when it
# releases DRM master) — both drop-ins are needed together.
#
# Fix: explicitly wait for plymouth-quit-wait.service before starting sddm.

[Unit]
After=plymouth-quit-wait.service
