# /etc/systemd/system/plymouth-quit.service.d/sddm-first-frame.conf
# Deployed by: ansible/roles/boot/session_manager/tasks/config.yml
#
# Seamless Plymouth -> SDDM handoff via --retain-splash (S197).
#
# The vendor plymouth-quit.service runs `plymouth quit` with no flags, which
# EXPLICITLY hides the splash the moment Plymouth releases DRM. sddm.service is
# ordered After=plymouth-quit.service, so the screen goes black in the window
# between "splash hidden" and "greeter painted its first frame" (200-400ms).
# Plymouth and the SDDM/sway greeter both need DRM master, so they cannot paint
# at the same time: a pre-sleep only shifts WHEN the black starts, it cannot
# remove it (that was the old `ExecStartPre=/bin/sleep 0.3` mitigation).
#
# Fix: override ExecStart so plymouth exits with --retain-splash, which leaves
# the frozen final splash frame on the framebuffer after Plymouth releases DRM.
# The greeter then paints over a still splash instead of over black, and the
# SDDM Main.qml entity opacity fade-in (S155) cross-fades on top: a dissolve.
#
# The empty `ExecStart=` line resets the unit's ExecStart list (required before
# setting a replacement in a systemd drop-in); the `-` prefix makes a nonzero
# exit non-fatal so quit never blocks the boot.
#
# Verify with boot-profile.sh / vm-boot-iterate.sh. If a residual gap still
# shows in the VM capture, add a minimal `ExecStartPre=/bin/sleep 0.1` (NOT 0.3).

[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
