# /etc/systemd/system/plymouth-quit.service.d/sddm-first-frame.conf
# Deployed by: ansible/roles/boot/session_manager/tasks/config.yml
#
# Give SDDM 300ms to paint its first frame before Plymouth releases the DRM
# framebuffer. Without this delay, Plymouth drops DRM while SDDM is still
# loading QML — the screen goes black for 200–400ms (visible hiccup).
#
# Tune the sleep value with boot-profile.sh on real hardware:
#   bash spells/boot-profile.sh     # observe plymouth-quit-wait timing
# If the gap disappears, reduce to 0.1s; if still visible, increase to 0.5s.

[Service]
ExecStartPre=/bin/sleep 0.3
