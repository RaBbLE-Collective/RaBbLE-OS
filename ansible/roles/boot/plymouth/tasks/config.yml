---
# boot/plymouth/tasks/config.yml
# Deploys the rabble-aether boot splash — a frame-player port of the canonical
# RaBbLE-Boot.html animation. Entity frames are pre-captured into
# files/rabble-aether/frames/ by files/rabble-aether/build-assets.sh; Ansible
# only deploys what is committed — it never runs the capture.

- name: Create rabble system fonts directory
  ansible.builtin.file:
    path: /usr/share/fonts/rabble-fonts
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [boot, plymouth, config]

- name: Install Orbitron variable font
  ansible.builtin.copy:
    src: rabble-aether/fonts/Orbitron-Variable.ttf
    dest: /usr/share/fonts/rabble-fonts/Orbitron-Variable.ttf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: [rebuild font cache, rebuild initrd]
  tags: [boot, plymouth, config]

- name: Deploy rabble-aether Plymouth theme
  ansible.builtin.copy:
    src: rabble-aether/
    dest: /usr/share/plymouth/themes/rabble-aether/
    owner: root
    group: root
    directory_mode: "0755"
    mode: "0644"
  become: true
  notify: rebuild initrd
  tags: [boot, plymouth, config]

- name: Include JetBrains Mono in the initrd for Image.Text rendering
  ansible.builtin.copy:
    dest: /etc/dracut.conf.d/90-rabble-plymouth-fonts.conf
    content: |
      # rabble-aether Plymouth theme — fonts + theme assets + GPU driver for splash
      # install_items (theme dir): explicit inclusion because 95plymouth dracut
      #   module does not reliably auto-include script-module themes with large
      #   PNG frame arrays. Directory path → dracut recurses entire tree.
      # add_drivers (amdgpu): present in initrd for DRM availability, but does NOT
      #   prevent the simpledrm→amdgpu takeover; that requires plymouth.use-simpledrm=1
      #   in the kernel cmdline (set in group_vars/asus_proart_p16.yml).
      # Pango falls back to DejaVu Sans if font paths are ever missing.
      install_items+=" /usr/share/fonts/jetbrains-mono-fonts/JetBrainsMono-Bold.otf /usr/share/fonts/jetbrains-mono-fonts/JetBrainsMono-Regular.otf /usr/share/fonts/rabble-fonts/Orbitron-Variable.ttf "
      install_items+=" /usr/share/plymouth/themes/rabble-aether/ "
      add_drivers+=" amdgpu "
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: rebuild initrd
  tags: [boot, plymouth, config]

- name: Read current Plymouth default theme
  ansible.builtin.command: plymouth-set-default-theme
  register: plymouth_current_theme
  changed_when: false
  failed_when: false
  become: true
  tags: [boot, plymouth, config]

- name: Set rabble-aether as the default Plymouth theme
  ansible.builtin.command: plymouth-set-default-theme rabble-aether
  when: (plymouth_current_theme.stdout | trim) != 'rabble-aether'
  become: true
  notify: rebuild initrd
  tags: [boot, plymouth, config]

- name: Rebuild initramfs with current Plymouth theme and dracut conf
  ansible.builtin.command: dracut --force
  become: true
  changed_when: true
  tags: [boot, plymouth, config]
