# ansible/roles/desktop/hyprland/vars/main.yml
# =============================================================================
# Hyprland role — internal variables
# vars/ = role-internal, not intended for override
# defaults/ = user-overridable role config
# =============================================================================

# ── Repos ─────────────────────────────────────────────────────────────────────

hyprland_copr: "lionheartp/Hyprland"     # COPR providing Hyprland v0.54+

# ── Paths ─────────────────────────────────────────────────────────────────────
# rabble_home and dotfiles_repo_root are set in group_vars/all.yml and resolve
# to the invoking user's home and repo root regardless of become: true.

hypr_config_dir: "{{ rabble_home }}/.config/hypr"

# ── Config files ──────────────────────────────────────────────────────────────
# Deployed with mode 0644 via the "Deploy hypr config files" task.
# src paths are relative to dotfiles_repo_root.

hypr_config_files:
  - src:  config/hypr/hyprland.conf
    dest: "{{ hypr_config_dir }}/hyprland.conf"

  # conf.d modules
  - src:  config/hypr/conf.d/animations.conf
    dest: "{{ hypr_config_dir }}/conf.d/animations.conf"
  - src:  config/hypr/conf.d/autostart.conf
    dest: "{{ hypr_config_dir }}/conf.d/autostart.conf"
  - src:  config/hypr/conf.d/env.conf
    dest: "{{ hypr_config_dir }}/conf.d/env.conf"
  - src:  config/hypr/conf.d/input.conf
    dest: "{{ hypr_config_dir }}/conf.d/input.conf"
  - src:  config/hypr/conf.d/keybinds.conf
    dest: "{{ hypr_config_dir }}/conf.d/keybinds.conf"
  - src:  config/hypr/conf.d/look.conf
    dest: "{{ hypr_config_dir }}/conf.d/look.conf"
  - src:  config/hypr/conf.d/windowrules.conf
    dest: "{{ hypr_config_dir }}/conf.d/windowrules.conf"
  - src:  config/hypr/conf.d/workspaces.conf
    dest: "{{ hypr_config_dir }}/conf.d/workspaces.conf"
  - src:  config/hypr/conf.d/functionkeys.conf
    dest: "{{ hypr_config_dir }}/conf.d/functionkeys.conf"

  # hypridle.conf is gone: the idle chain moved to config/rabble-shell/idle.conf (dotctl bundle
  # rabble-shell, shared with niri), started by rabble-idle. Nothing to deploy here.

  # hyprlock.conf — must live at ~/.config/hypr/hyprlock.conf
  - src:  config/hypr/hyprlock.conf
    dest: "{{ hypr_config_dir }}/hyprlock.conf"

  # hyprpaper.conf — wallpaper daemon config
  - src:  config/hypr/hyprpaper.conf
    dest: "{{ hypr_config_dir }}/hyprpaper.conf"

# ── Wallpaper ─────────────────────────────────────────────────────────────────
# Deployed to ~/.config/hypr/wallpapers/ — referenced by hyprpaper.conf.
# Generated by assets/generate_wallpaper.py — re-run to refresh.

wallpaper_src:  "assets/wallpaper.png"
wallpaper_dir:  "{{ hypr_config_dir }}/wallpapers"
wallpaper_dest: "{{ wallpaper_dir }}/wallpaper.png"

# ── Scripts ───────────────────────────────────────────────────────────────────
# Deployed with mode 0755 via the "Deploy hypr scripts" task.

hypr_scripts:
  - src:  config/hypr/scripts/kb-cycle.sh
    dest: "{{ hypr_config_dir }}/scripts/kb-cycle.sh"

# ── Packages ──────────────────────────────────────────────────────────────────

hyprland_core_packages:
  - hyprland                       # Wayland compositor
  - hyprland-devel                 # Plugin support via hyprpm
  - xdg-desktop-portal-hyprland   # Screensharing and portal support
  - hyprland-guiutils
  - hyprpaper                      # Wallpaper daemon
  - hypridle                       # Idle daemon
  - hyprlock                       # Screen locker
  - hyprcursor                     # Cursor management
  - hyprpicker                     # Colour picker
  - polkit                         # Privilege escalation framework
  - hyprpolkitagent                # Polkit authentication agent for Hyprland

# ── Version pin ───────────────────────────────────────────────────────────────
# The COPR publishes with no update gating. 2026-11-07 a plain `dnf update` took
# hyprpaper 0.8.5 but skipped the hyprgraphics 0.6.0 / hyprtoolkit 0.6.0-2 it was
# built against (a libheif dep wasn't resolvable yet): heap corruption at launch,
# no wallpaper, hyprlock on the same skewed libs. So the whole hypr* family is
# locked as one set in /etc/dnf/versionlock.toml; routine `dnf upgrade` leaves it
# alone. To move Hyprland: bump every EVR here together (repoquery the COPR for
# the latest coherent set), test in a VM, then layerctl. Epoch is explicit.
hyprland_pin_set: "0.57.2"         # label only, for the versionlock comment
hyprland_pins:
  - { name: hyprland,                    evr: "0:0.57.2-1.fc44" }
  - { name: hyprland-devel,              evr: "0:0.57.2-1.fc44" }
  - { name: hyprland-uwsm,               evr: "0:0.57.2-1.fc44" }
  - { name: hyprland-guiutils,           evr: "0:0.2.2-2.fc44" }
  - { name: hyprland-qt-support,         evr: "0:0.1.0-12.fc44" }
  - { name: hyprland-protocols-devel,    evr: "0:0.8.0-1.fc44" }
  - { name: xdg-desktop-portal-hyprland, evr: "1:1.5.0-1.fc44" }
  - { name: aquamarine,                  evr: "0:0.16.0-1.fc44" }
  - { name: aquamarine-devel,            evr: "0:0.16.0-1.fc44" }
  - { name: hyprgraphics,                evr: "0:0.6.0-1.fc44" }
  - { name: hyprgraphics-devel,          evr: "0:0.6.0-1.fc44" }
  - { name: hyprtoolkit,                 evr: "0:0.6.0-2.fc44" }
  - { name: hyprutils,                   evr: "0:0.14.3-1.fc44" }
  - { name: hyprutils-devel,             evr: "0:0.14.3-1.fc44" }
  - { name: hyprlang,                    evr: "0:0.6.8-4.fc44" }
  - { name: hyprlang-devel,              evr: "0:0.6.8-4.fc44" }
  - { name: hyprwire,                    evr: "0:0.3.1-3.fc44" }
  - { name: hyprwire-devel,              evr: "0:0.3.1-3.fc44" }
  - { name: hyprcursor,                  evr: "0:0.1.14-1.fc44" }
  - { name: hyprcursor-devel,            evr: "0:0.1.14-1.fc44" }
  - { name: hyprwayland-scanner-devel,   evr: "0:0.4.6-1.fc44" }
  - { name: hyprlock,                    evr: "0:0.9.7-1.fc44" }
  - { name: hyprpaper,                   evr: "0:0.8.5-1.fc44" }
  - { name: hypridle,                    evr: "0:0.1.8-1.fc44" }
  - { name: hyprpicker,                  evr: "0:0.4.8-1.fc44" }
  - { name: hyprpolkitagent,             evr: "0:0.2.0-2.fc44" }

