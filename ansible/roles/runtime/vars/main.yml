---
# Defaults — overridden by group_vars per hardware target

# ── NPU identity (resolved from group_vars at runtime) ────────────────────────
npu:
  enabled: "{{ npu.enabled | default(false) }}"
  vendor:  "{{ npu.vendor  | default('none') }}"
  family:  "{{ npu.family  | default('none') }}"
  driver:  "{{ npu.driver  | default('none') }}"

xrt_rollback: "{{ xrt_rollback | default(false) }}"

# ── FastFlowLM — AMD XDNA2 LLM inference ─────────────────────────────────────
# enabled: true on any XDNA2 machine (Strix Point, Krackan, Strix Halo)
# src_dir: where to clone FastFlowLM source for builds
# Install tries COPR binary first; falls back to cmake source build.
# XDNA1 (Ryzen AI 7000/8000/200-series) is NOT supported.
fastflowlm:
  enabled: true
  repo: "https://github.com/FastFlowLM/FastFlowLM.git"
  src_dir: "/opt/src/FastFlowLM"
  install_prefix: "/opt/fastflowlm"

# ── Lemonade Server — OpenAI-compat local AI API ──────────────────────────────
# Wraps FastFlowLM (NPU), optionally llama.cpp (GPU), Whisper, Kokoro TTS.
# Serves on :8000 — add as local_npu provider in sCoRE chain.
# enabled: false by default — enable when NPU inference is validated.
# Known issue: 'lemonade-server recipes' labels NPU as "Requires Windows" —
#   labeling bug only; Linux NPU inference works fine.
lemonade:
  enabled: false
  port: 8000

# ── llama.cpp source build ────────────────────────────────────────────────────
# cuda_architectures: "native" = auto-detect GPU at build time (recommended).
#   Override per hardware target: "89" (RTX 4060/Ada), "86" (RTX 30xx/Ampere)
# version: pin to a llama.cpp release tag (e.g. "b4600") — "HEAD" for latest.
llama_cpp:
  enabled: true
  repo: "https://github.com/ggerganov/llama.cpp"
  version: "b4600"
  src_dir: "/opt/llama.cpp"
  build_dir: "/opt/llama.cpp/build"
  install_prefix: "/usr/local"
  cuda_architectures: "native"
