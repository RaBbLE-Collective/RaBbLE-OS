---
# =============================================================================
# XRT + XDNA2 Userspace Runtime
# Provides NPU programming interfaces above the amdxdna kernel driver.
#
# Stack:   amdxdna (kernel, in-tree since 7.0) → XRT (userspace) → FastFlowLM
#
# Kernel 7.0+ ships amdxdna in-tree. No DKMS needed. This task only
# installs the userspace XRT runtime that sits above /dev/accel/.
#
# COPR path (preferred): xanderlent/amd-npu-driver
#   Known caveats as of 2026-06-18:
#   - Experimental, volunteer-maintained
#   - F43 packages may have Boost mismatch on F44 → source build needed
#   - XRT version may lag upstream (2.19.0 = April 2025 build)
#   - `flm validate` firmware incompatibility = outdated XRT → build from source
#
# IOMMU: must remain enabled. Never add amd_iommu=off to kernel cmdline.
# =============================================================================

# ── COPR repository ───────────────────────────────────────────────────────────

- name: Check if xanderlent/amd-npu-driver COPR is enabled
  ansible.builtin.stat:
    path: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:xanderlent:amd-npu-driver.repo
  register: _xrt_copr_stat
  tags: [runtime, xrt, npu]

- name: Enable xanderlent/amd-npu-driver COPR
  become: true
  ansible.builtin.command: dnf copr enable -y xanderlent/amd-npu-driver
  when: not _xrt_copr_stat.stat.exists
  register: _xrt_copr_enable
  failed_when: false
  tags: [runtime, xrt, npu]

- name: Warn if COPR enable failed
  ansible.builtin.debug:
    msg: >-
      WARNING: Could not enable xanderlent/amd-npu-driver COPR.
      XRT packages will be unavailable. You may need to build from source.
      See Grimoire: RaBbLE-OS/hardware/RaBbLE-OS-Hardware-NPU-XDNA2.md
  when:
    - _xrt_copr_enable is defined
    - _xrt_copr_enable.rc is defined
    - _xrt_copr_enable.rc != 0
  tags: [runtime, xrt, npu]

# ── Package installation ──────────────────────────────────────────────────────

- name: Install XRT runtime and XDNA driver packages
  become: true
  ansible.builtin.dnf:
    name:
      - xrt
      - xdna-driver
    state: present
    allow_downgrade: false
    allowerasing: true
  register: _xrt_install
  failed_when: false
  tags: [runtime, xrt, npu]

- name: Report XRT install result
  ansible.builtin.debug:
    msg: >-
      XRT install: {{ 'succeeded' if not _xrt_install.failed | default(false) else 'FAILED' }}.
      If failed, check: (1) COPR enabled for your Fedora version,
      (2) Boost library conflict (F44 may need source build),
      (3) OpenCL ICD conflict (try: dnf install --allowerasing xrt xdna-driver).
      See: Grimoire RaBbLE-OS/hardware/RaBbLE-OS-Hardware-NPU-XDNA2.md
  tags: [runtime, xrt, npu]

# ── Symlink workaround ────────────────────────────────────────────────────────
# XRT from COPR installs to /usr/xrt, not /opt/xilinx/xrt.
# FastFlowLM and legacy tools expect /opt/xilinx/xrt.

- name: Ensure /opt/xilinx exists
  become: true
  ansible.builtin.file:
    path: /opt/xilinx
    state: directory
    mode: '0755'
  when: not _xrt_install.failed | default(false)
  tags: [runtime, xrt, npu]

- name: Symlink /opt/xilinx/xrt → /usr/xrt
  become: true
  ansible.builtin.file:
    src: /usr/xrt
    dest: /opt/xilinx/xrt
    state: link
    force: true
  when:
    - not _xrt_install.failed | default(false)
    - ansible_facts.stat is not defined or not ansible_facts.stat.exists
  failed_when: false
  tags: [runtime, xrt, npu]

- name: Symlink /usr/xrt/lib → /usr/xrt/lib64
  become: true
  ansible.builtin.file:
    src: /usr/xrt/lib64
    dest: /usr/xrt/lib
    state: link
    force: true
  when: not _xrt_install.failed | default(false)
  failed_when: false
  tags: [runtime, xrt, npu]

# ── Dynamic linker paths ──────────────────────────────────────────────────────

- name: Configure ld.so paths for XRT and FastFlowLM libraries
  become: true
  ansible.builtin.copy:
    dest: /etc/ld.so.conf.d/xrt-npu.conf
    content: |
      /opt/fastflowlm/lib
      /opt/xilinx/xrt/lib64
    owner: root
    group: root
    mode: '0644'
  notify: run ldconfig
  tags: [runtime, xrt, npu]

# ── memlock limits ────────────────────────────────────────────────────────────
# REQUIRED — missing memlock causes misleading "mmap failed (err=-11)" XRT errors.
# Must reboot or re-login for PAM limits to take effect on existing sessions.

- name: Configure PAM memlock limits for NPU DMA
  become: true
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-amdxdna.conf
    content: |
      # AMD XDNA2 NPU — required for DMA buffer allocation via XRT
      * soft memlock unlimited
      * hard memlock unlimited
    owner: root
    group: root
    mode: '0644'
  tags: [runtime, xrt, npu]

- name: Ensure /etc/systemd/system.conf.d exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: [runtime, xrt, npu]

- name: Configure systemd default memlock for NPU services
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system.conf.d/99-amdxdna.conf
    content: |
      [Manager]
      DefaultLimitMEMLOCK=infinity
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd daemon
  tags: [runtime, xrt, npu]

# ── udev permissions ──────────────────────────────────────────────────────────

- name: Deploy udev rule for /dev/accel NPU access
  become: true
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/99-amdxdna.rules
    content: |
      # AMD XDNA2 NPU — render group rw access for XRT userspace
      SUBSYSTEM=="accel", KERNEL=="accel*", GROUP="render", MODE="0660"
    owner: root
    group: root
    mode: '0644'
  notify: reload udev rules
  tags: [runtime, xrt, npu]

# ── User group membership ─────────────────────────────────────────────────────

- name: Add user to render group (required for /dev/accel access)
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: render
    append: true
  tags: [runtime, xrt, npu]

- name: Add user to video group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: video
    append: true
  tags: [runtime, xrt, npu]

# ── Verification ──────────────────────────────────────────────────────────────

- name: Check /dev/accel devices
  ansible.builtin.find:
    paths: /dev/accel
    file_type: any
  register: _accel_devices
  failed_when: false
  tags: [runtime, xrt, npu, verify]

- name: Run xrt-smi examine
  ansible.builtin.command: /usr/xrt/bin/xrt-smi examine
  environment:
    LD_LIBRARY_PATH: "/usr/xrt/lib64:/opt/xilinx/xrt/lib64"
  register: _xrt_examine
  changed_when: false
  failed_when: false
  tags: [runtime, xrt, npu, verify]

- name: Report XRT + NPU runtime status
  ansible.builtin.debug:
    msg:
      - "accel devices: {{ _accel_devices.files | map(attribute='path') | list | default(['none']) }}"
      - "xrt-smi: {{ _xrt_examine.stdout_lines | default(['xrt-smi not available — install or build from source']) }}"
  tags: [runtime, xrt, npu, verify]

- name: Reminder — reboot required for memlock and group changes
  ansible.builtin.debug:
    msg: >-
      REMINDER: Reboot required for memlock limits and group membership (render/video) to take effect.
      After reboot, validate with: flm validate
  tags: [runtime, xrt, npu]
