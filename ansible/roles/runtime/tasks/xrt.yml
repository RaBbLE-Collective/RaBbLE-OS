---
# =============================================================================
# XRT + XDNA2 Userspace Runtime
# Provides NPU programming interfaces above the amdxdna kernel driver.
#
# Stack:   amdxdna (kernel, in-tree since 7.0) → XRT (userspace) → FastFlowLM
#
# Kernel 7.0+ ships amdxdna in-tree. No DKMS needed. This task only
# installs the userspace XRT runtime that sits above /dev/accel/.
#
# COPR path (preferred): xanderlent/amd-npu-driver
#   Known caveats as of 2026-06-18:
#   - Experimental, volunteer-maintained
#   - F43 packages may have Boost mismatch on F44 → source build needed
#   - XRT version may lag upstream (2.19.0 = April 2025 build)
#   - `flm validate` firmware incompatibility = outdated XRT → build from source
#
# IOMMU: must remain enabled. Never add amd_iommu=off to kernel cmdline.
# =============================================================================

# ── COPR repository ───────────────────────────────────────────────────────────

- name: Check if xanderlent/amd-npu-driver COPR is enabled
  ansible.builtin.stat:
    path: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:xanderlent:amd-npu-driver.repo
  register: _xrt_copr_stat
  tags: [runtime, xrt, npu]

- name: Enable xanderlent/amd-npu-driver COPR
  become: true
  ansible.builtin.command: dnf copr enable -y xanderlent/amd-npu-driver
  when: not _xrt_copr_stat.stat.exists
  register: _xrt_copr_enable
  failed_when: false
  tags: [runtime, xrt, npu]

- name: Warn if COPR enable failed
  ansible.builtin.debug:
    msg: >-
      WARNING: Could not enable xanderlent/amd-npu-driver COPR.
      XRT packages will be unavailable. You may need to build from source.
      See Grimoire: RaBbLE-OS/hardware/RaBbLE-OS-Hardware-NPU-XDNA2.md
  when:
    - _xrt_copr_enable is defined
    - _xrt_copr_enable.rc is defined
    - _xrt_copr_enable.rc != 0
  tags: [runtime, xrt, npu]

# ── Package installation ──────────────────────────────────────────────────────

- name: Install XRT runtime and XDNA driver packages
  become: true
  ansible.builtin.dnf:
    name:
      - xrt
      - xdna-driver
    state: present
    allow_downgrade: false
    allowerasing: true
  register: _xrt_install
  failed_when: false
  tags: [runtime, xrt, npu]

- name: Report XRT install result
  ansible.builtin.debug:
    msg: >-
      XRT install: {{ 'succeeded' if not _xrt_install.failed | default(false) else 'FAILED' }}.
      If failed, check: (1) COPR enabled for your Fedora version,
      (2) Boost library conflict (F44 may need source build),
      (3) OpenCL ICD conflict (try: dnf install --allowerasing xrt xdna-driver).
      See: Grimoire RaBbLE-OS/hardware/RaBbLE-OS-Hardware-NPU-XDNA2.md
  tags: [runtime, xrt, npu]

# ── Symlink workaround ────────────────────────────────────────────────────────
# XRT from COPR installs to /usr/xrt, not /opt/xilinx/xrt.
# FastFlowLM and legacy tools expect /opt/xilinx/xrt.

- name: Ensure /opt/xilinx exists
  become: true
  ansible.builtin.file:
    path: /opt/xilinx
    state: directory
    mode: '0755'
  when: not _xrt_install.failed | default(false)
  tags: [runtime, xrt, npu]

- name: Symlink /opt/xilinx/xrt → /usr/xrt
  become: true
  ansible.builtin.file:
    src: /usr/xrt
    dest: /opt/xilinx/xrt
    state: link
    force: true
  when:
    - not _xrt_install.failed | default(false)
    - ansible_facts.stat is not defined or not ansible_facts.stat.exists
  failed_when: false
  tags: [runtime, xrt, npu]

- name: Symlink XRT core libs into /usr/xrt/lib (COPR puts them in lib64, cmake looks in lib)
  become: true
  ansible.builtin.shell: |
    for f in /usr/xrt/lib64/libxrt*.so* /usr/xrt/lib64/libxilinx*.so*; do
      [ -e "$f" ] && ln -sf "$f" "/usr/xrt/lib/$(basename $f)"
    done
  args:
    executable: /bin/bash
  when: not _xrt_install.failed | default(false)
  changed_when: true
  failed_when: false
  tags: [runtime, xrt, npu]

# ── XRT API version check + source build fallback ────────────────────────────
# COPR XRT 2.19.0 (April 2025) is missing xrt::runlist::add(xrt::run&&).
# FastFlowLM prebuilt NPU libs (src/lib/*.so) require this symbol.
#
# NOTE: xdna-driver's XRT submodule is ALSO pinned to 2.19.0. Building from
# xdna-driver source produces the same XRT and does NOT add this symbol.
# Primary fix = shim (see below). Source build is available for firmware
# compatibility issues (flm validate mismatch), NOT for this linker symbol.
# To trigger source build manually: set xrt_force_rebuild=true in group_vars
# or pass -e xrt_force_rebuild=true on the playbook command line.

- name: Check for required XRT runlist::add(xrt::run&&) symbol
  ansible.builtin.shell: >-
    nm -D /usr/xrt/lib64/libxrt_coreutil.so 2>/dev/null |
    grep -q '_ZN3xrt7runlist3addEONS_3runE'
  register: _xrt_rvalue_ok
  changed_when: false
  failed_when: false
  tags: [runtime, xrt, npu]

- name: Install XRT source build dependencies
  become: true
  ansible.builtin.dnf:
    name:
      - cmake
      - ninja-build
      - git
      - boost-devel
      - ocl-icd-devel
      - opencl-headers
      - libdrm-devel
      - rapidjson-devel
      - python3-devel
      - libffi-devel
      - libuuid-devel
      - systemd-devel
      - ncurses-devel
      - elfutils-devel
      - tcsh
      - rpm-build
    state: present
  when: xrt_force_rebuild | default(false)
  tags: [runtime, xrt, npu]

- name: Clone xdna-driver repository for XRT source build
  ansible.builtin.git:
    repo: "https://github.com/amd/xdna-driver.git"
    dest: /opt/src/xdna-driver
    version: HEAD
    recursive: true
    update: true
  when: xrt_force_rebuild | default(false)
  tags: [runtime, xrt, npu]

- name: Build XRT userspace from xdna-driver source (npu profile, ~20-30 min)
  ansible.builtin.shell: |
    cd /opt/src/xdna-driver/xrt/build
    ./build.sh -npu -opt -noctest -j{{ ansible_processor_vcpus }}
  args:
    executable: /bin/bash
  register: _xrt_src_build
  when: xrt_force_rebuild | default(false)
  changed_when: _xrt_src_build.rc == 0
  failed_when: false
  tags: [runtime, xrt, npu]

- name: Install XRT RPM from source build (replaces COPR 2.19.0)
  become: true
  ansible.builtin.shell: |
    dnf install --allowerasing -y /opt/src/xdna-driver/xrt/build/Release/*.rpm
  args:
    executable: /bin/bash
  when:
    - xrt_force_rebuild | default(false)
    - _xrt_src_build is defined
    - _xrt_src_build.rc == 0
  changed_when: true
  failed_when: false
  tags: [runtime, xrt, npu]

- name: Re-symlink XRT core libs after source build (output path may differ from COPR)
  become: true
  ansible.builtin.shell: |
    for f in /usr/xrt/lib64/libxrt*.so* /usr/xrt/lib64/libxilinx*.so*; do
      [ -e "$f" ] && ln -sf "$f" "/usr/xrt/lib/$(basename $f)"
    done
  args:
    executable: /bin/bash
  when:
    - xrt_force_rebuild | default(false)
    - _xrt_src_build is defined
    - _xrt_src_build.rc == 0
  changed_when: true
  failed_when: false
  tags: [runtime, xrt, npu]

- name: Report XRT symbol status
  ansible.builtin.debug:
    msg: >-
      XRT runlist::add(xrt::run&&): {{ 'present in COPR XRT' if _xrt_rvalue_ok.rc == 0 else
      'MISSING from COPR 2.19.0 — shim will be compiled and injected at FLM link time.
      To rebuild XRT from source (for firmware mismatch): re-run with -e xrt_force_rebuild=true' }}
  tags: [runtime, xrt, npu]

# ── XRT runlist::add(xrt::run&&) compatibility shim ──────────────────────────
# COPR XRT 2.19.0 AND xdna-driver's pinned XRT submodule both lack this rvalue
# overload. FastFlowLM prebuilt NPU libs in src/lib/*.so require it.
# Root cause: the overload was added to XRT upstream after the xdna-driver pin.
# Fix: compile a C++ shim that provides the symbol by forwarding to the existing
# const-lvalue add(xrt::run const&). xrt::run is a ref-counted pimpl handle;
# copy vs. move semantics are equivalent at the handle level.

- name: Create XRT shim source directory
  become: true
  ansible.builtin.file:
    path: /opt/src/xrt_shim
    state: directory
    mode: '0755'
  when: _xrt_rvalue_ok.rc != 0
  tags: [runtime, xrt, npu]

- name: Write XRT runlist::add(xrt::run&&) shim source
  become: true
  ansible.builtin.copy:
    dest: /opt/src/xrt_shim/xrt_runlist_shim.c
    content: |
      /*
       * XRT compatibility shim: provides xrt::runlist::add(xrt::run&&) missing from
       * COPR XRT 2.19.0. Works at the raw symbol level to avoid C++ class member
       * rules — cannot define an out-of-line member function not declared in the class.
       *
       * Calling convention on x86-64: both add(run const&) and add(run&&) pass
       * this in rdi and a pointer-to-run in rsi. The redirect is safe.
       *
       *   _ZN3xrt7runlist3addERKNS_3runE = add(xrt::run const&)  — present in 2.19.0
       *   _ZN3xrt7runlist3addEONS_3runE  = add(xrt::run&&)       — MISSING, provided here
       */
      void _ZN3xrt7runlist3addERKNS_3runE(void*, void*);

      void _ZN3xrt7runlist3addEONS_3runE(void* self, void* run_ref) {
          _ZN3xrt7runlist3addERKNS_3runE(self, run_ref);
      }
    owner: root
    group: root
    mode: '0644'
  when: _xrt_rvalue_ok.rc != 0
  tags: [runtime, xrt, npu]

- name: Compile XRT runlist shim into shared library
  become: true
  ansible.builtin.shell: |
    gcc -shared -fPIC -O2 \
        -o /opt/src/xrt_shim/libxrt_runlist_shim.so \
        /opt/src/xrt_shim/xrt_runlist_shim.c
  args:
    executable: /bin/bash
  register: _xrt_shim_compile
  when: _xrt_rvalue_ok.rc != 0
  changed_when: _xrt_shim_compile.rc == 0
  failed_when: false
  tags: [runtime, xrt, npu]

- name: Report XRT shim compile outcome
  ansible.builtin.debug:
    msg: >-
      XRT runlist shim: {{ 'compiled at /opt/src/xrt_shim/libxrt_runlist_shim.so' if (_xrt_shim_compile.rc | default(1)) == 0 else
      'FAILED to compile — FastFlowLM link will fail. Ensure g++ is installed and XRT headers are at /opt/xilinx/xrt/include' }}
  when: _xrt_rvalue_ok.rc != 0
  tags: [runtime, xrt, npu]

# ── Dynamic linker paths ──────────────────────────────────────────────────────

- name: Configure ld.so paths for XRT and FastFlowLM libraries
  become: true
  ansible.builtin.copy:
    dest: /etc/ld.so.conf.d/xrt-npu.conf
    content: |
      /opt/fastflowlm/lib
      /opt/xilinx/xrt/lib64
    owner: root
    group: root
    mode: '0644'
  notify: run ldconfig
  tags: [runtime, xrt, npu]

# ── memlock limits ────────────────────────────────────────────────────────────
# REQUIRED — missing memlock causes misleading "mmap failed (err=-11)" XRT errors.
# Must reboot or re-login for PAM limits to take effect on existing sessions.

- name: Configure PAM memlock limits for NPU DMA
  become: true
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-amdxdna.conf
    content: |
      # AMD XDNA2 NPU — required for DMA buffer allocation via XRT
      * soft memlock unlimited
      * hard memlock unlimited
    owner: root
    group: root
    mode: '0644'
  tags: [runtime, xrt, npu]

- name: Ensure /etc/systemd/system.conf.d exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: [runtime, xrt, npu]

- name: Configure systemd default memlock for NPU services
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system.conf.d/99-amdxdna.conf
    content: |
      [Manager]
      DefaultLimitMEMLOCK=infinity
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd daemon
  tags: [runtime, xrt, npu]

# ── udev permissions ──────────────────────────────────────────────────────────

- name: Deploy udev rule for /dev/accel NPU access
  become: true
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/99-amdxdna.rules
    content: |
      # AMD XDNA2 NPU — render group rw access for XRT userspace
      SUBSYSTEM=="accel", KERNEL=="accel*", GROUP="render", MODE="0660"
    owner: root
    group: root
    mode: '0644'
  notify: reload udev rules
  tags: [runtime, xrt, npu]

# ── User group membership ─────────────────────────────────────────────────────

- name: Add user to render group (required for /dev/accel access)
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: render
    append: true
  tags: [runtime, xrt, npu]

- name: Add user to video group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: video
    append: true
  tags: [runtime, xrt, npu]

# ── Verification ──────────────────────────────────────────────────────────────

- name: Check /dev/accel devices
  ansible.builtin.find:
    paths: /dev/accel
    file_type: any
  register: _accel_devices
  failed_when: false
  tags: [runtime, xrt, npu, verify]

- name: Run xrt-smi examine
  ansible.builtin.command: /usr/xrt/bin/xrt-smi examine
  environment:
    LD_LIBRARY_PATH: "/usr/xrt/lib64:/opt/xilinx/xrt/lib64"
  register: _xrt_examine
  changed_when: false
  failed_when: false
  tags: [runtime, xrt, npu, verify]

- name: Report XRT + NPU runtime status
  ansible.builtin.debug:
    msg:
      - "accel devices: {{ _accel_devices.files | map(attribute='path') | list | default(['none']) }}"
      - "xrt-smi: {{ _xrt_examine.stdout_lines | default(['xrt-smi not available — install or build from source']) }}"
  tags: [runtime, xrt, npu, verify]

- name: Reminder — reboot required for memlock and group changes
  ansible.builtin.debug:
    msg: >-
      REMINDER: Reboot required for memlock limits and group membership (render/video) to take effect.
      After reboot, validate with: flm validate
  tags: [runtime, xrt, npu]
