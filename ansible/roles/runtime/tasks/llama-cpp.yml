---
# =============================================================================
# llama.cpp — Source Build (Vulkan or CUDA backend)
# =============================================================================
# CPU/GPU fallback inference engine — complements FastFlowLM (NPU path).
# Provides llama-server (OpenAI-compat HTTP on :8080) for models without
# XDNA2-specific variants, or for CPU-only / iGPU workloads.
#
# Backends:
#   vulkan  — AMD Radeon iGPU or any Vulkan-capable GPU. Default.
#             Packages: vulkan-headers, vulkan-loader-devel, glslang
#   cuda    — NVIDIA GPU. Requires NVIDIA CUDA repo to be configured first.
#             Packages: cuda-toolkit, cuda-devel (from NVIDIA CUDA repo)
#             Set: llama_cpp.backend: "cuda" and llama_cpp.cuda_architectures
#               "86" = RTX 3060/3xxx (Ampere), "89" = RTX 4060/Ada, "native" = auto
#
# ProArt P16 current config: backend=vulkan (RTX 3060 suspended, iGPU active)
# To switch to CUDA: set gpu_mode: nvidia in group_vars, configure CUDA repo,
#   then set llama_cpp.backend: "cuda" in group_vars/asus_proart_p16.yml.
#
# Build time: ~5-15 min depending on CPU/ccache state.
# Idempotency: skips rebuild if installed binary matches target version tag.
# =============================================================================

# ── Build dependencies ────────────────────────────────────────────────────────

- name: Install llama.cpp build dependencies (Vulkan)
  become: true
  ansible.builtin.dnf:
    name:
      - git
      - cmake
      - gcc-c++
      - ninja-build
      - vulkan-headers
      - vulkan-loader-devel
      - glslang
      - glslc
    state: present
  when: llama_cpp.backend | default('vulkan') == "vulkan"
  tags: [runtime, llama-cpp]

- name: Install llama.cpp build dependencies (CUDA)
  become: true
  ansible.builtin.dnf:
    name:
      - git
      - cmake
      - gcc-c++
      - ninja-build
      - cuda-toolkit
      - cuda-devel
    state: present
  when: llama_cpp.backend | default('vulkan') == "cuda"
  tags: [runtime, llama-cpp]

# ── Version check (idempotency) ───────────────────────────────────────────────

- name: Check installed llama-server version
  ansible.builtin.command: llama-server --version
  register: _llama_installed_version
  changed_when: false
  failed_when: false
  tags: [runtime, llama-cpp]

- name: Set rebuild needed flag
  ansible.builtin.set_fact:
    _llama_rebuild_needed: >-
      {{
        _llama_installed_version.rc != 0 or
        llama_cpp.version not in (_llama_installed_version.stdout | default(''))
      }}
  tags: [runtime, llama-cpp]

# ── Source clone / update ─────────────────────────────────────────────────────

- name: Clone llama.cpp source
  ansible.builtin.git:
    repo: "{{ llama_cpp.repo }}"
    dest: "{{ llama_cpp.src_dir }}"
    version: "{{ llama_cpp.version }}"
    depth: 1
    force: false
  when: _llama_rebuild_needed
  tags: [runtime, llama-cpp]

# ── GCC 15 compatibility patch ────────────────────────────────────────────────
# GCC 15 (Fedora 43) no longer transitively includes <cstdint>; llama-mmap.h
# uses uint32_t without including it, causing compile failure. Upstream fixed
# this in versions after b4600; this patch keeps the pinned version buildable.

- name: Patch llama-mmap.h for GCC 15 (missing <cstdint> include)
  ansible.builtin.lineinfile:
    path: "{{ llama_cpp.src_dir }}/src/llama-mmap.h"
    insertafter: '#include <vector>'
    line: '#include <cstdint>'
    state: present
  when: _llama_rebuild_needed
  tags: [runtime, llama-cpp]

# ── CMake configure ───────────────────────────────────────────────────────────

- name: Create build directory
  ansible.builtin.file:
    path: "{{ llama_cpp.build_dir }}"
    state: directory
    mode: '0755'
  when: _llama_rebuild_needed
  tags: [runtime, llama-cpp]

- name: Configure llama.cpp with CMake (Vulkan backend)
  ansible.builtin.command: >
    cmake
      -S {{ llama_cpp.src_dir }}
      -B {{ llama_cpp.build_dir }}
      -G Ninja
      -DGGML_VULKAN=ON
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX={{ llama_cpp.install_prefix }}
      -DLLAMA_BUILD_SERVER=ON
      -DLLAMA_BUILD_TOOLS=ON
  when:
    - _llama_rebuild_needed
    - llama_cpp.backend | default('vulkan') == "vulkan"
  tags: [runtime, llama-cpp]

- name: Configure llama.cpp with CMake (CUDA backend)
  ansible.builtin.command: >
    cmake
      -S {{ llama_cpp.src_dir }}
      -B {{ llama_cpp.build_dir }}
      -G Ninja
      -DGGML_CUDA=ON
      -DCMAKE_CUDA_ARCHITECTURES={{ llama_cpp.cuda_architectures }}
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX={{ llama_cpp.install_prefix }}
      -DLLAMA_BUILD_SERVER=ON
      -DLLAMA_BUILD_TOOLS=ON
  when:
    - _llama_rebuild_needed
    - llama_cpp.backend | default('vulkan') == "cuda"
  environment:
    CUDA_PATH: /usr/local/cuda
    PATH: "{{ ansible_env.PATH }}:/usr/local/cuda/bin"
  tags: [runtime, llama-cpp]

# ── Build + install ───────────────────────────────────────────────────────────

- name: Build llama.cpp (this takes ~5-15 minutes)
  ansible.builtin.command: cmake --build {{ llama_cpp.build_dir }} --config Release -j{{ ansible_processor_vcpus }}
  when: _llama_rebuild_needed
  environment:
    CUDA_PATH: "{{ '/usr/local/cuda' if llama_cpp.backend | default('vulkan') == 'cuda' else '' }}"
    PATH: "{{ ansible_env.PATH + ':/usr/local/cuda/bin' if llama_cpp.backend | default('vulkan') == 'cuda' else ansible_env.PATH }}"
  async: 1200
  poll: 30
  tags: [runtime, llama-cpp]

- name: Install llama.cpp binaries to {{ llama_cpp.install_prefix }}/bin
  become: true
  ansible.builtin.command: cmake --install {{ llama_cpp.build_dir }}
  when: _llama_rebuild_needed
  tags: [runtime, llama-cpp]

# ── Verify ────────────────────────────────────────────────────────────────────

- name: Verify llama-server binary
  ansible.builtin.command: llama-server --version
  register: _llama_server_version
  changed_when: false
  failed_when: false
  tags: [runtime, llama-cpp, verify]

- name: Report llama.cpp install status
  ansible.builtin.debug:
    msg: "llama.cpp ({{ llama_cpp.backend | default('vulkan') }}): {{ _llama_server_version.stdout | default('not found — check build logs') }}"
  tags: [runtime, llama-cpp]
