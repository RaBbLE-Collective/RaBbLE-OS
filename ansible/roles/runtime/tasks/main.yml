---
# =============================================================================
# Runtime Role — AI/ML Userspace Runtimes
# =============================================================================
# Sits above hardware (kernel modules) and below applications.
# Provides the compute substrate that agentic workloads target.
#
# Stack:
#   hardware/amd-npu.yml  → amdxdna kernel module + firmware
#   runtime/xrt.yml       → XRT userspace + XDNA2 runtime libraries
#   runtime/llama-cpp.yml → llama.cpp source build with CUDA  ← HERE
# =============================================================================

- name: Configure XRT + XDNA2 userspace runtime
  ansible.builtin.import_tasks: xrt.yml
  when:
    - npu.enabled | bool
    - npu.vendor == "amd"
    - npu.family in ["xdna2", "xdna"]
  tags: [runtime, xrt, npu]

- name: Build and install llama.cpp with CUDA
  ansible.builtin.import_tasks: llama-cpp.yml
  when: llama_cpp.enabled | bool
  tags: [runtime, llama-cpp]
