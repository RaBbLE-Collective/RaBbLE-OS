    platform: all
    layer: core
    ks: false

  - name: neovim
    category: core.editor
    reason: Primary editor — EDITOR=nvim and VISUAL=nvim set in env.conf
    source: fedora
    platform: all
    layer: core
    ks: false

  - name: btop
    category: core.monitoring
    reason: System resource monitor — daily driver for process, CPU, GPU, memory view
    source: fedora
    platform: all
    layer: core
    ks: false

  - name: fastfetch
    category: core.identity
    reason: System info display — RaBbLE-OS identity shown on terminal open
    source: fedora
    platform: all
    layer: core
    ks: false

  - name: bash-completion
    category: core.shell
    reason: Tab completion for bash — needed even when zsh is default shell
    source: fedora
    platform: all
    layer: core
    ks: false

  # ── Shell — ZSH ───────────────────────────────────────────────────────────

  - name: zsh
    category: core.shell.zsh
