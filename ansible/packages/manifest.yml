# ansible/packages/manifest.yml
# =============================================================================
# RaBbLE-OS — Package Manifest
# Single source of truth for all packages across Ansible and Kickstart.
#
# Fields:
#   name:     exact dnf/rpm/flatpak package name
#   category: dot-notation mirroring the Ansible role tree
#   reason:   required — the decision record, kept with the package forever
#   source:   fedora | rpmfusion-free | rpmfusion-nonfree | copr:<name> | repo:<name> | flatpak
#   platform: all | asus_proart_p16 | generic_x64
#   layer:    installation tier (see LAYERS below)
#   ks:       true = include in Kickstart %packages block
#
# LAYERS — applied in order:
#   ks-bootstrap   minimum for KS %post to clone repo and run Ansible
#   core           always-on system essentials, no DE dependency
#   boot           boot chain: grub config, plymouth, sddm
#   audio          pipewire stack
#   fonts          typography — must land before any DE component renders
#   wayland        protocol support layer below the compositor
#   compositor     Hyprland and its ecosystem
#   desktop        shell components: bar, notifications, launcher, terminal
#   apps           user-facing applications
#   hardware       machine-specific drivers and tools (filtered by platform)
#   layer/*        optional feature groups, installed per profile/tag
#
# Non-DNF installs (git clones, scripts, manual downloads):
#   powerlevel10k  — git clone, handled in desktop/shell/zsh/tasks/packages.yml
#   Bibata cursor  — manual download; HYPRCURSOR_THEME=Bibata-Modern-Classic in env.conf
#   VSCode repo    — RPM repo added in layer/dev role before dnf install
# =============================================================================

packages:

  # ═══════════════════════════════════════════════════════════════════════════
  # KS BOOTSTRAP
  # Minimum packages for Kickstart %post to clone the repo and run Ansible.
  # These go into the %packages block unconditionally.
  # ═══════════════════════════════════════════════════════════════════════════

  - name: git
    category: ks-bootstrap
    reason: Clone RaBbLE-OS repo in %post before Ansible runs
    source: fedora
    platform: all
    layer: ks-bootstrap
    ks: true

  - name: ansible
    category: ks-bootstrap
    reason: Run RaBbLE-OS-Bootstrap.sh in KS %post
    source: fedora
    platform: all
    layer: ks-bootstrap
    ks: true

  - name: python3
    category: ks-bootstrap
    reason: Ansible runtime dependency
    source: fedora
    platform: all
    layer: ks-bootstrap
    ks: true

  - name: curl
    category: ks-bootstrap
    reason: HTTP fetch — bootstrap scripts, COPR enablement, spell dependencies
    source: fedora
    platform: all
    layer: ks-bootstrap
    ks: true

  # ═══════════════════════════════════════════════════════════════════════════
  # CORE
  # Always-on system packages. No DE dependency. Installed first by Ansible.
  # ═══════════════════════════════════════════════════════════════════════════

  - name: NetworkManager
    category: core.network
    reason: Network management — required from first boot before any DE layer
    source: fedora
    platform: all
    layer: core
    ks: true

  - name: NetworkManager-wifi
    category: core.network
    reason: WiFi support for NetworkManager
    source: fedora
    platform: all
    layer: core
    ks: true

  - name: wget
    category: core.utils
    reason: Alternate HTTP fetch — some scripts prefer wget over curl
    source: fedora
    platform: all
    layer: core
    ks: false

  - name: rsync
    category: core.utils
    reason: File sync — used by dotctl, backup spells, Grimoire sync
    source: fedora
    platform: all
    layer: core
    ks: false

  - name: unzip
    category: core.utils
    reason: Archive extraction — font installs, general tooling
    source: fedora
    platform: all
    layer: core
    ks: false

  - name: p7zip
    category: core.utils
    reason: 7z archive support
    source: fedora
    platform: all
    layer: core
    ks: false

  - name: jq
    category: core.utils
    reason: JSON processing — sCoRE integration, shell scripts, manifest tooling
    source: fedora
    platform: all
    layer: core
    ks: false

  - name: polkit
    category: core.security
    reason: Privilege escalation framework — required for any pkexec/GUI elevation workflow
    source: fedora
    platform: all
    layer: core
    ks: true

  - name: fwupd
    category: core.firmware
    reason: Firmware update daemon — LVFS support for BIOS/hardware patches
    source: fedora
    platform: all
    layer: core
    ks: false

  - name: xdg-user-dirs
    category: core.xdg
    reason: Creates standard user dirs (Downloads, Documents, etc.) on first login
    source: fedora
    platform: all
    layer: core
    ks: false

  - name: xdg-utils
    category: core.xdg
    reason: xdg-open and xdg-mime — MIME type associations and default app dispatch
