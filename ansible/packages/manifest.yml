    source: fedora
    platform: all
    layer: audio
    ks: false

  - name: pipewire-pulse
    category: audio
    reason: PulseAudio compatibility — most apps talk PA protocol; this bridges them to PipeWire
    source: fedora
    platform: all
    layer: audio
    ks: false

  - name: pipewire-alsa
    category: audio
    reason: ALSA compatibility — older apps and games that bypass PA and talk ALSA directly
    source: fedora
    platform: all
    layer: audio
    ks: false

  - name: pipewire-jack
    category: audio
    reason: JACK compatibility — low-latency audio production workflows
    source: fedora
    platform: all
    layer: audio
    ks: false

