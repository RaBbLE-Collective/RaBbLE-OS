    source: fedora
    platform: all
    layer: core
    ks: false

  - name: zsh-autosuggestions
    category: core.shell.zsh
    reason: Fish-style history-based command suggestions
    source: fedora
    platform: all
    layer: core
    ks: false

  # powerlevel10k: installed via git clone — not a Fedora package
  # See: ansible/roles/desktop/shell/zsh/tasks/packages.yml

  # ═══════════════════════════════════════════════════════════════════════════
  # BOOT CHAIN
  # ═══════════════════════════════════════════════════════════════════════════

