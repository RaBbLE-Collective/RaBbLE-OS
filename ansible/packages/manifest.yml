  #
  # Install method notes (non-DNF tools):
  #   claude-code       → npm install -g @anthropic-ai/claude-code
  #   codex             → npm install -g @openai/codex
  #   opencode          → npm install -g opencode-ai
  #   gemini-cli        → npm install -g @google/gemini-cli
  #   aider             → pipx install aider-chat   (requires: pipx — DNF below)
  #   ollama            → curl https://ollama.ai/install.sh | sh  (ships systemd service)
  #   free-claude-code  → git clone + uv sync (requires: uv — curl installer, not DNF)
  #   vllm              → pip venv (disabled by default; heavy GPU install)
  #   builder-skills    → npx @agent-native/skills@latest add
