    reason: Hyprland-native polkit authentication agent — handles pkexec GUI dialogs
    source: "copr:lionheartp/Hyprland"
    platform: all
    layer: compositor
    ks: false
    # FIXME: autostart.conf currently calls polkit-gnome binary path which does not exist.
    # Update autostart.conf line to: exec-once = systemctl --user start hyprpolkitagent

