# ansible/layers.conf — layerctl layer registry
#
# One [section] per layer. Add a layer by adding a section; layerctl needs no
# other edit. Section order is the order shown by `layerctl status`.
#
#   desc    one-line description (shown in list/status/help)
#   verify  shell command run by `layerctl verify NAME` ($HOME etc. expand then)
#   extra   ansible --extra-vars flipped on when applying/removing by name;
#           opt-in layers use this so `apply all` / `upgrade` never pick them up
#   alias   space-separated shorthand names that resolve to this layer
#   group   main (default) | sub (targeted sub-layer, listed apart in help)
#
# Anything NOT listed here but present as an Ansible tag (e.g. vscode, waybar,
# hyprland, plymouth) still works: `layerctl apply vscode` runs --tags vscode.
# See `layerctl list`.

[base]
desc   = Base system (repos, packages, locale, fonts)
verify = rpm -q git ansible-core

[hardware]
desc   = Hardware abstraction (GPU, asusctl, NPU, power)
verify = asusctl profile -l && supergfxctl --status
alias  = hw

[runtime]
desc   = GPU/NPU runtimes (llama.cpp, XRT, FastFlowLM, Lemonade)
verify = LD_LIBRARY_PATH=/usr/local/lib64 llama-server --version

[monitoring]
desc   = System observability (btop, htop, nvtop, sensors)
verify = command -v btop && command -v sensors
alias  = monitor

[virtualization]
desc   = QEMU/KVM host stack
verify = systemctl is-active libvirtd
alias  = virt kvm vm

[boot]
desc   = Boot chain (GRUB2, Plymouth, SDDM)
verify = systemctl is-active sddm && plymouth-set-default-theme

[snapper]
desc   = Snapper (Btrfs snapshots)
verify = snapper -c root list
alias  = snapshots

[desktop]
desc   = Desktop (Hyprland, Quickshell, terminal, shell)
verify = hyprctl version && systemctl --user is-active waybar || true

[apps]
desc   = Applications (VSCodium, browsers, dev tools). Sub-tags: vscode browsers theming filemanager
verify = command -v codium || command -v code
alias  = applications

[ai-harnesses]
desc   = AI coding harnesses (all agents)
verify = command -v claude && systemctl --user is-active free-claude-code || true
alias  = ai harnesses

[dotfiles]
desc   = Dotfiles (symlink ~/.config entries + dotctl deploy)
verify = test -L ~/.config/hypr/hyprland.conf
alias  = dots

[bottles]
desc   = Bottles, Wine app compat (opt-in: UP Studio/Cetus3D bottle, planned Affinity)
verify = flatpak info com.usebottles.bottles
extra  = rabble_enable_wine_bottles=true
alias  = wine

[containers]
desc   = Docker CE + Podman container runtimes (opt-in)
verify = docker --version && podman --version
extra  = rabble_enable_containers=true
alias  = docker podman

[esp-idf]
desc   = ESP-IDF embedded toolchain(s) via EIM CLI + picocom/usbutils/fzf, RaBbLE-Pocket firmware (opt-in)
verify = command -v eim && eim list && test -L $HOME/esp/esp-idf-default
extra  = rabble_enable_esp_idf=true
alias  = esp espidf

[arduino-cli]
desc   = arduino-cli + ESP32 core, vendor reference .ino examples only (opt-in)
verify = $HOME/.local/bin/arduino-cli version && $HOME/.local/bin/arduino-cli core list | grep -q esp32:esp32
extra  = rabble_enable_arduino_cli=true
alias  = arduino

[atlas-sentry]
desc   = ATLAS sentry host dev tooling: opencv/numpy/pyserial, dialout, Arduino Nano Every core (opt-in)
verify = python3 -c 'import cv2, numpy, serial'
extra  = rabble_enable_atlas_sentry=true
alias  = atlas

[dotnet-sdk]
desc   = .NET SDK (dotnet-sdk-8.0), Fedora-native package (opt-in)
verify = command -v dotnet && dotnet --list-sdks
extra  = rabble_enable_dotnet_sdk=true
alias  = dotnet

[gnome]
desc   = GNOME Shell, Aether-themed secondary DE, SDDM fallback + theming testbed (opt-in)
verify = rpm -q gnome-shell gnome-session-wayland-session >/dev/null && ! rpm -q gdm >/dev/null 2>&1 && test -f /usr/share/wayland-sessions/gnome.desktop
extra  = rabble_enable_gnome_desktop=true

[niri]
desc   = niri scrolling-tiling compositor, trial session alongside Hyprland; config via dotctl (opt-in)
verify = rpm -q niri swaybg >/dev/null && test -f /usr/share/wayland-sessions/niri.desktop
extra  = rabble_enable_niri=true

[creator-apps]
desc   = Creator apps, data-driven single-Flatpak apps (see `layerctl app list`) (opt-in)
verify = verify_creator_apps
extra  = rabble_enable_creator_apps=true
alias  = creator

[claude-code]
desc   = Claude Code CLI
verify = command -v claude
group  = sub
alias  = claude

[free-claude-code]
desc   = free-claude-code proxy (Anthropic API -> NIM/Groq/etc)
verify = systemctl --user is-active free-claude-code && curl -sf http://127.0.0.1:8082/health || curl -sf http://127.0.0.1:8082/
group  = sub
alias  = fcc

[codex]
desc   = OpenAI Codex CLI
verify = command -v codex
group  = sub

[opencode]
desc   = OpenCode agent
verify = command -v opencode
group  = sub

[aider]
desc   = Aider pair-programmer
verify = command -v aider
group  = sub

[gemini-cli]
desc   = Gemini CLI
verify = command -v gemini
group  = sub
alias  = gemini

[ollama]
desc   = Ollama local inference server
verify = systemctl is-active ollama
group  = sub

[vllm]
desc   = vLLM inference server (heavy, GPU required)
verify = command -v vllm
group  = sub

[builder-skills]
desc   = BuilderIO slash-command skills for Claude Code
verify = test -d $HOME/.claude/skills
group  = sub

[all]
desc   = Full system, all layers in order
group  = sub
