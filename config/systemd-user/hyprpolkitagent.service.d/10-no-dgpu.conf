# The polkit dialog needs no GPU. Qt otherwise probes every render node, and holding the NVIDIA
# one open keeps the dGPU out of runtime suspend (S332). Software Qt Quick + Mesa-only EGL/Vulkan.
[Service]
Environment=QT_QUICK_BACKEND=software
Environment=__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
Environment=VK_LOADER_DRIVERS_DISABLE=nvidia_icd.json
