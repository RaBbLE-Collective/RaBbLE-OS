# eyes-deny.conf -- windows rabble-eyes refuses to capture (S334 ruling).
# One rule per line:  app:<regex>  or  title:<regex>
# Case-insensitive, matched with re.search. app: tests the app_id / class,
# title: tests the window title. Lines starting with # are comments.
# There is deliberately no override flag. Edit this file to change policy.
# Deployed copy (~/.config/RaBbLE/eyes-deny.conf) wins over the repo copy.

# Password managers and keyrings
app:keepassxc
app:bitwarden
app:1password
app:proton.?pass
app:seahorse
app:gnome-keyring
app:org\.gnome\.keyring
title:keepassxc
title:bitwarden
title:1password
title:proton pass

# Private browsing
title:private browsing
title:incognito
title:inprivate

# Banking and money
title:\b(bank\w*|credit union|paypal|venmo|brokerage|online banking)\b
