# /etc/systemd/logind.conf.d/99-rabble-lid.conf
# RaBbLE-OS lid and power button policy
#
# Lid close: suspend. hypridle's before_sleep_cmd fires hyprlock
# before the suspend completes, so the session is locked before display off.
# HandleLidSwitchDocked=ignore prevents suspend when an external display
# is connected (HDMI docked use-case).
#
# Power button: suspend (not poweroff).
# HandlePowerKeySuspended=ignore prevents logind from acting on the power
# button keypress that woke the machine — without this, pressing power to
# resume from suspend immediately triggers a second suspend or poweroff.

[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
HandlePowerKey=suspend
HandlePowerKeySuspended=ignore
