# conf.d/windowrules.conf
# =============================================================================
# Window & Layer Rules — Hyprland 0.55 (legacy hyprlang format)
# =============================================================================
# Syntax reference (0.55 legacy .conf):
#   windowrule = <effect> <value>, match:<prop> <regex>[, match:<prop> <regex>, ...]
#   windowrule = <effect> <value>[, <effect> <value>, ...]
#
# Effects and matchers are comma-separated tokens. Each token is split on the
# FIRST space: left side = effect name OR "match:<prop>", right = value/regex.
# Effects: float, tile, center, size, pin, opacity, workspace, idle_inhibit,
#          no_initial_focus, keep_aspect_ratio, immediate, move, monitor, etc.
# Boolean effects (float, center, pin, keep_aspect_ratio, immediate, ...):
#   value must be "true"/"false"/"1"/"0" — e.g. "float true", "center true"
# Matchers: match:class, match:title, match:initial_class, match:initial_title,
#           match:modal, match:float, match:xwayland, match:fullscreen, etc.
# Rule order: all matching rules are applied in file order; LAST rule wins per
#   effect. Put catch-alls FIRST, specific rules LAST to override.
#
# IMPORTANT: workspace assignments apply to ALL windows matching the class,
# including child dialogs. Use match:modal false AND match:float false to
# exclude transient/modal dialogs from workspace assignments.
# =============================================================================

# ── Modal / transient dialogs — catch ALL apps first ─────────────────────────
# Any window that is modal (transient dialog) floats and centers regardless of
# class. This runs FIRST (lowest priority) so app-specific rules can still
# override. Modal = true catches Qt/GTK dialogs that set transient_for.
windowrule = float true,  match:modal true
windowrule = center true, match:modal true

# ── Default floating window size ─────────────────────────────────────────────
# Only applies to windows that are already floating (match:float true prevents
# this from sizing tiled windows). Specific app rules below override.
# NOTE: "80% 80%" uses muParser expression syntax — percent of monitor size.
# This does NOT apply to modal dialogs (they have their own intrinsic size).
windowrule = size 80% 80%, match:float true, match:modal false

# ── Idle inhibit ──────────────────────────────────────────────────────────────
windowrule = idle_inhibit fullscreen, match:class ^(mpv|vlc|celluloid)$
windowrule = idle_inhibit fullscreen, match:class ^(firefox|chromium|brave-browser|zen)$

# ── Picture-in-Picture ────────────────────────────────────────────────────────
windowrule = float true,             match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)
windowrule = keep_aspect_ratio true, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)
windowrule = pin true,               match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)
windowrule = size 25% 25%,           match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)
windowrule = move 73% 72%,           match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)

# ── Float: system dialogs and file pickers ────────────────────────────────────
# Generic title-based float (save/open dialogs in many apps)
windowrule = float true,  match:title ^(Open|Save|Save As|Open File|Open Folder|Select File)
windowrule = float true,  match:title ^(Confirm|Warning|Error|Alert|Question|Information)
windowrule = float true,  match:title ^(File Manager|File Browser|File Chooser)
windowrule = float true,  match:title (Preference|Preferences|Settings|Properties|About)$
# Portal file picker
windowrule = float true,  match:class ^(xdg-desktop-portal-gtk)$
windowrule = float true,  match:class ^(xdg-portal-dialog)$

# ── termfilechooser portal — yazi in kitty, floating file picker ──────────────
windowrule = float true,       match:class ^(kitty)$, match:title ^(termfilechooser)
windowrule = size 900 580,     match:class ^(kitty)$, match:title ^(termfilechooser)
windowrule = center true,      match:class ^(kitty)$, match:title ^(termfilechooser)

# ── RaBbLE agent popup (LLM usage, etc.) ─────────────────────────────────────
windowrule = float true,        match:class ^(rabble-popup)$
windowrule = center true,       match:class ^(rabble-popup)$
windowrule = size 680 420,      match:class ^(rabble-popup)$
windowrule = opacity 0.94 0.94, match:class ^(rabble-popup)$

# ── Float: calculator, color picker, calendar popups ─────────────────────────
windowrule = float true,  match:class ^(gnome-calculator|kcalc|qalculate-gtk)$
windowrule = float true,  match:class ^(Yad|yad)$
windowrule = float true,  match:class ^(zenity)$

# ── Float: network and bluetooth settings ─────────────────────────────────────
windowrule = float true,   match:class ^(nm-connection-editor)$
windowrule = float true,   match:class ^(nm-applet)$
windowrule = float true,   match:class ^(bluedevil-wizard|blueberry)$
windowrule = float true,   match:class ^(blueman-manager)$
windowrule = size 700 500, match:class ^(nm-connection-editor)$
windowrule = size 600 450, match:class ^(blueman-manager|blueberry)$
windowrule = center true,  match:class ^(nm-connection-editor)$
windowrule = center true,  match:class ^(blueman-manager|blueberry)$

# ── Float: volume / audio control ────────────────────────────────────────────
windowrule = float true,   match:class ^(pavucontrol|pavucontrol-qt)$
windowrule = size 800 500, match:class ^(pavucontrol|pavucontrol-qt)$
windowrule = center true,  match:class ^(pavucontrol|pavucontrol-qt)$

# ── UP Studio (TierTime Cetus3D MK2 slicer, via Bottles) ─────────────────────
# Reverted 2026-07-27 (S205): the float + dedicated-workspace + launch-script
# positioning combo (see git history for the removed rules and
# scripts/upstudio3-launch.sh) was fighting these windows more than helping —
# Bottles' XWayland-under-Wine windows resist windowrule/hyprctl-imposed
# geometry inconsistently, causing unreliable placement/z-order while
# debugging the printer-connection issue. Launch plain (`bottles-cli run -b
# UPStudio3 -p "UP Studio3"`) on an empty workspace instead; let it use
# Hyprland's default tiling. Revisit a positioning rule only once the app
# itself is actually working end to end.

# ── Float: file manager — centered smallish floating window ──────────────────
# Covers Dolphin (target) and Thunar/Nemo/Nautilus alternatives.
# Dolphin's Wayland app-ID is org.kde.dolphin — the .*dolphin.* pattern catches
# both the Wayland app-ID and the X11 StartupWMClass.
# Child dialogs (rename, copy, properties) have the SAME class and are also
# matched here — they float, get centered, and we DON'T force a fixed size on
# them so their intrinsic Qt dialog size is preserved (modal rule handles centering).
windowrule = float true,   match:class ^(.*[Dd]olphin.*|.*[Tt]hunar.*|.*[Nn]emo.*|.*[Nn]autilus.*)$
windowrule = center true,  match:class ^(.*[Dd]olphin.*|.*[Tt]hunar.*|.*[Nn]emo.*|.*[Nn]autilus.*)$
# Only size the MAIN file manager window, not its dialogs
# (modal dialogs have match:modal true so this match:modal false scopes it out)
windowrule = size 900 580, match:class ^(.*[Dd]olphin.*|.*[Tt]hunar.*|.*[Nn]emo.*|.*[Nn]autilus.*)$, match:modal false

# ── Float: Firefox popups and secondary windows ───────────────────────────────
# Main Firefox window tiles normally. Popups, dialogs, and child windows float.
# PiP is excluded here — handled above.
windowrule = float true,   match:class ^(firefox|firefox-esr|zen-browser|zen|Zen)$, match:title ^(Firefox — Sharing Indicator)
windowrule = float true,   match:class ^(firefox|firefox-esr|zen-browser|zen|Zen)$, match:title ^(Opening )
windowrule = float true,   match:class ^(firefox|firefox-esr|zen-browser|zen|Zen)$, match:title ^(Extension: )
windowrule = float true,   match:class ^(firefox|firefox-esr|zen-browser|zen|Zen)$, match:title ^(Firefox)$
windowrule = float true,   match:class ^(firefox|firefox-esr|zen-browser|zen|Zen)$, match:title ^(About )
windowrule = float true,   match:class ^(firefox|firefox-esr|zen-browser|zen|Zen)$, match:title ^(Print)
windowrule = float true,   match:class ^(firefox|firefox-esr|zen-browser|zen|Zen)$, match:title ( — Page Info)$
windowrule = float true,   match:class ^(firefox|firefox-esr|zen-browser|zen|Zen)$, match:title ^(Enter Password)
windowrule = float true,   match:class ^(firefox|firefox-esr|zen-browser|zen|Zen)$, match:title ^(Save )
windowrule = center true,  match:class ^(firefox|firefox-esr|zen-browser|zen|Zen)$, match:title ^(Firefox)$
windowrule = center true,  match:class ^(firefox|firefox-esr|zen-browser|zen|Zen)$, match:title ^(About )
windowrule = center true,  match:class ^(firefox|firefox-esr|zen-browser|zen|Zen)$, match:title ^(Print)

# ── Float: general application popups ────────────────────────────────────────
# Catch common popup/dialog title patterns across all apps
windowrule = float true,   match:title ^(About )
windowrule = float true,   match:title ^(Preferences)$
windowrule = float true,   match:title ^(Settings)$
windowrule = float true,   match:title ^(Properties)$
windowrule = float true,   match:title ( Properties)$
windowrule = float true,   match:title ^(Choose )
windowrule = float true,   match:title ^(Select )
windowrule = float true,   match:title ^(Pick )
windowrule = center true,  match:title ^(About )
windowrule = center true,  match:title ^(Preferences)$
windowrule = center true,  match:title ^(Settings)$

# ── File picker sizing ────────────────────────────────────────────────────────
windowrule = size 900 600,  match:class ^(xdg-desktop-portal-gtk)$
windowrule = center true,   match:class ^(xdg-desktop-portal-gtk)$

# ── IDE: suppress spurious popup focus ───────────────────────────────────────
windowrule = no_initial_focus true, match:class ^(.*jetbrains.*)$, match:title ^(win[0-9]+)$
windowrule = no_initial_focus true, match:class ^(VSCodium|codium)$, match:title ^(Open File)
windowrule = no_initial_focus true, match:class ^(Zed)$, match:title ^(Open File)

# ── Workspace assignments ─────────────────────────────────────────────────────
# IMPORTANT: Add match:modal false AND match:float false to exclude child dialogs
# from workspace assignments. Without these, a Firefox "save file" dialog would
# be sent silently to workspace 2 even when you're on workspace 1.
#
# ws 1 — terminals (kitty opens here by default via keybind)
# ws 2 — browser
windowrule = workspace 2 silent, match:class ^(firefox|firefox-esr)$, match:modal false, match:float false
windowrule = workspace 2 silent, match:class ^(zen-browser|zen|Zen)$, match:modal false, match:float false
windowrule = workspace 2 silent, match:class ^(chromium|brave-browser)$, match:modal false, match:float false
# ws 3 — files
# workspace assignment removed: file manager floats on current workspace via rules above
# ws 4 — comms
windowrule = workspace 4 silent, match:class ^(Signal|signal)$, match:modal false, match:float false
windowrule = workspace 4 silent, match:class ^(discord|Discord|vesktop)$, match:modal false, match:float false
windowrule = workspace 4 silent, match:class ^(slack|Slack)$, match:modal false, match:float false
# ws 9 — monitoring / scratchpad terminals (routed there manually)
# ws 10 — music / media players
windowrule = workspace 10 silent, match:class ^(Spotify|spotify)$, match:modal false, match:float false
windowrule = workspace 10 silent, match:class ^(mpv|vlc|celluloid)$, match:modal false, match:float false

# ── VM workspace (5) ─────────────────────────────────────────────────────────
# virt-manager and its VM console windows go to ws 5 automatically.
# NOT silent — Hyprland follows the window to ws 5 on open so you know it landed.
# Exclude modals so virt-manager dialogs (new VM wizard, etc.) stay on current ws.
windowrule = workspace 5, match:class ^(virt-manager)$, match:modal false, match:float false

# ── Audio mixer popup (Waybar audio click → scripts/audio-popup.sh) ───────────
# Toggled from the bar; float + size so it reads as a popup panel, not a full
# tile. The top-right *position* is set imperatively by audio-popup.sh (Hyprland
# auto-centers this GTK float and ignores a `move` windowrule for it). Covers the
# Wayland app_id and the XWayland class. ~480px wide.
windowrule = float true,        match:class ^(org\.pulseaudio\.pavucontrol|[Pp]avucontrol)$
windowrule = size 480 600,      match:class ^(org\.pulseaudio\.pavucontrol|[Pp]avucontrol)$
windowrule = opacity 0.96 0.92, match:class ^(org\.pulseaudio\.pavucontrol|[Pp]avucontrol)$

# ── Opacity ───────────────────────────────────────────────────────────────────
# Terminal — slight transparency to let blur/wallpaper breathe
windowrule = opacity 0.95 0.90, match:class ^(kitty)$
# File manager — very slight opacity so it doesn't feel painted on
windowrule = opacity 0.97 0.95, match:class ^(dolphin|Dolphin|thunar|Thunar|nemo|Nemo|nautilus|Nautilus)$
# Code editors — slight transparency; blur+wallpaper bleed through like tinted glass
windowrule = opacity 0.94 0.88, match:class ^(VSCodium|codium|Zed|zed)$
# Browser — fully opaque
windowrule = opacity 1.0 1.0,  match:class ^(firefox|zen-browser|chromium)$

# ── Tearing / VRR per app ─────────────────────────────────────────────────────
# Allow tearing for games/video on fullscreen to reduce latency
windowrule = immediate true, match:class ^(steam_app_.*)$
windowrule = immediate true, match:class ^(mpv)$

# ── Layer rules ───────────────────────────────────────────────────────────────
# Valid layerrule effects: blur, blur_popups, ignore_alpha, no_anim, dim_around,
#   xray, animation, order, above_lock, no_screen_share
# Valid matchers: match:namespace, match:class, match:title, match:modal, etc.
# ignore_alpha expects a float 0.0–1.0 (alpha threshold for blur to ignore)
layerrule = blur true,        match:namespace fuzzel
layerrule = blur true,        match:namespace notifications
layerrule = ignore_alpha 0.0, match:namespace notifications
layerrule = blur true,        match:namespace swaync-notification-window
layerrule = ignore_alpha 0.0, match:namespace swaync-notification-window
layerrule = blur true,        match:namespace swaync-control-center
layerrule = ignore_alpha 0.0, match:namespace swaync-control-center
layerrule = blur true,        match:namespace logout_dialog
