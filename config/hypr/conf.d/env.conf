# dotfiles/hyprland/conf.d/env.conf
# Runtime environment variables for Hyprland session.
# Scale / DPI overrides are in machine.conf (ansible-generated).

# ── Wayland ───────────────────────────────────────────────────────────────────
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# ── Qt ────────────────────────────────────────────────────────────────────────
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# ── GTK ───────────────────────────────────────────────────────────────────────
env = GDK_BACKEND,wayland,x11,*
env = GTK_USE_PORTAL,1

# ── Apps ──────────────────────────────────────────────────────────────────────
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = _JAVA_AWT_WM_NONREPARENTING,1
env = SDL_VIDEODRIVER,wayland

# ── Cursor ────────────────────────────────────────────────────────────────────
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
# XCURSOR_SIZE and HYPRCURSOR_SIZE are set in machine.conf per display

# ── NVIDIA hybrid (AMD primary @ card1, NVIDIA drives HDMI @ card0) ──────────
# AQ_DRM_DEVICES: AMD first (primary renderer), NVIDIA second (HDMI scanout)
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0
env = LIBVA_DRIVER_NAME,nvidia
env = NVD_BACKEND,direct
# Hardware cursors on NVIDIA Wayland cause artifacts — disable
env = HYPRLAND_NO_HARDWARE_CURSORS,1

# ── Editors / tools ───────────────────────────────────────────────────────────
env = EDITOR,nvim
env = VISUAL,nvim
env = TERMINAL,kitty
env = BROWSER,firefox
