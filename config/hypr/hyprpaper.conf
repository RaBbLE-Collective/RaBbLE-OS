# hyprpaper.conf — RaBbLE-OS wallpaper configuration
# Wallpaper assets live in config/wallpapers/ → deployed to ~/.config/wallpapers/

# Unquoted * is a real wildcard in hyprpaper's own matcher (WallpaperMatcher.cpp,
# isWildcard()) — matches any connected output regardless of its name. It must NOT
# be quoted: on hyprpaper 0.8 "*" matches nothing ("Monitor X has no target").
# `preload` is gone in 0.8; wallpaper{} loads on demand. This
# used to hardcode eDP-1/HDMI-A-1 (this dev laptop's own outputs), which
# silently matched nothing at all on any other machine (VM virtio display,
# bare-metal desktop with no eDP panel) — no error, just no wallpaper ever
# applied. One wildcard entry covers every target.
wallpaper {
    monitor = *
    path = ~/.config/wallpapers/RaBbLE_WP.PNG
    fit_mode = contain
}

splash = false
