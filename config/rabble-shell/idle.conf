# idle.conf — RaBbLE shell idle chain, shared by every compositor.
# Compositor-specific work lives behind rabble-lock / rabble-dpms, never here.
#
#   Lid close / suspend → before_sleep_cmd → loginctl lock-session → rabble-lock
#   5 min idle   → lock
#   5.5 min      → displays off
#   15 min       → suspend

general {
    lock_cmd            = ~/.config/rabble-shell/bin/rabble-lock
    before_sleep_cmd    = loginctl lock-session
    after_sleep_cmd     = ~/.config/rabble-shell/bin/rabble-dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout    = 300
    on-timeout = loginctl lock-session
    on-resume  = ~/.config/rabble-shell/bin/rabble-dpms on
}

listener {
    timeout    = 330
    on-timeout = ~/.config/rabble-shell/bin/rabble-dpms off
    on-resume  = ~/.config/rabble-shell/bin/rabble-dpms on
}

listener {
    timeout    = 900
    on-timeout = systemctl suspend
}
