<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="64" height="384">
  <defs>
    <style type="text/css">
      .bg { fill: #1a1b2e; }
      .bg-hover { fill: #222340; }
      .bg-pressed { fill: #00f5ff; opacity: 0.1; }
      .border { stroke: #bf5fff; stroke-width: 1; fill: none; }
      .border-focus { stroke: #00f5ff; stroke-width: 1; fill: none; }
      .text { fill: #e8e6f0; }
      .scrollbar { fill: #ff2d78; }
      .scrollbar-bg { fill: #0a0010; }
    </style>
  </defs>

  <!-- Button Normal -->
  <g id="PushButton">
    <rect class="bg" x="2" y="2" width="20" height="20" rx="3"/>
    <rect class="border" x="2" y="2" width="20" height="20" rx="3"/>
  </g>

  <!-- Button Hover -->
  <g id="PushButton-hover">
    <rect class="bg-hover" x="26" y="2" width="20" height="20" rx="3"/>
    <rect class="border" x="26" y="2" width="20" height="20" rx="3" stroke="#00f5ff" stroke-width="1"/>
  </g>

  <!-- Button Pressed -->
  <g id="PushButton-pressed">
    <rect class="bg" x="50" y="2" width="20" height="20" rx="3"/>
    <rect class="bg-pressed" x="50" y="2" width="20" height="20" rx="3"/>
    <rect class="border-focus" x="50" y="2" width="20" height="20" rx="3"/>
  </g>

  <!-- LineEdit Normal -->
  <g id="LineEdit">
    <rect class="bg" x="2" y="26" width="20" height="16" rx="2"/>
    <rect class="border" x="2" y="26" width="20" height="16" rx="2"/>
  </g>

  <!-- LineEdit Focus -->
  <g id="LineEdit-focus">
    <rect class="bg" x="26" y="26" width="20" height="16" rx="2"/>
    <rect class="border-focus" x="26" y="26" width="20" height="16" rx="2"/>
  </g>

  <!-- ComboBox -->
  <g id="ComboBox">
    <rect class="bg" x="50" y="26" width="20" height="16" rx="2"/>
    <rect class="border" x="50" y="26" width="20" height="16" rx="2"/>
  </g>

  <!-- ScrollBar Groove Vertical -->
  <g id="ScrollBar-groove1">
    <rect class="scrollbar-bg" x="2" y="50" width="6" height="20"/>
  </g>

  <!-- ScrollBar Slider Vertical -->
  <g id="ScrollBar-slider1">
    <rect class="scrollbar" x="2" y="50" width="6" height="20" rx="3"/>
  </g>

  <!-- ScrollBar Slider Vertical Hover -->
  <g id="ScrollBar-slider1-hover">
    <rect fill="#bf5fff" x="26" y="50" width="6" height="20" rx="3"/>
  </g>

  <!-- ScrollBar Groove Horizontal -->
  <g id="ScrollBar-groove2">
    <rect class="scrollbar-bg" x="50" y="50" width="20" height="6"/>
  </g>

  <!-- ScrollBar Slider Horizontal -->
  <g id="ScrollBar-slider2">
    <rect class="scrollbar" x="50" y="50" width="20" height="6" rx="3"/>
  </g>

  <!-- Menu Background -->
  <g id="Menu">
    <rect class="bg" x="2" y="76" width="20" height="24"/>
    <rect class="border" x="2" y="76" width="20" height="24"/>
  </g>

  <!-- MenuItem Hover -->
  <g id="MenuItem-hover">
    <rect fill="rgba(255,45,120,0.15)" x="26" y="76" width="20" height="24"/>
    <rect class="border" x="26" y="76" width="20" height="24"/>
  </g>

  <!-- CheckBox Normal -->
  <g id="CheckBox">
    <rect class="bg" x="50" y="76" width="14" height="14" rx="2"/>
    <rect class="border" x="50" y="76" width="14" height="14" rx="2"/>
  </g>

  <!-- CheckBox Checked -->
  <g id="CheckBox-checked">
    <rect class="bg" x="50" y="94" width="14" height="14" rx="2"/>
    <rect class="border-focus" x="50" y="94" width="14" height="14" rx="2"/>
    <text class="text" x="57" y="104" font-size="12" text-anchor="middle">✓</text>
  </g>

  <!-- RadioButton Normal -->
  <g id="RadioButton">
    <circle class="bg" cx="9" cy="119" r="7"/>
    <circle class="border" cx="9" cy="119" r="7" fill="none"/>
  </g>

  <!-- RadioButton Checked -->
  <g id="RadioButton-checked">
    <circle class="bg" cx="33" cy="119" r="7"/>
    <circle class="border-focus" cx="33" cy="119" r="7" fill="none"/>
    <circle fill="#00f5ff" cx="33" cy="119" r="3"/>
  </g>

  <!-- ToolButton Normal -->
  <g id="ToolButton">
    <rect class="bg" x="2" y="132" width="18" height="18" rx="2"/>
    <rect class="border" x="2" y="132" width="18" height="18" rx="2"/>
  </g>

  <!-- Tab Active -->
  <g id="Tab-normal">
    <rect class="bg" x="26" y="132" width="20" height="18" rx="2"/>
    <rect class="border-focus" x="26" y="132" width="20" height="18" rx="2"/>
  </g>

  <!-- Tab Inactive -->
  <g id="Tab-hover">
    <rect class="bg-hover" x="50" y="132" width="20" height="18" rx="2"/>
    <rect class="border" x="50" y="132" width="20" height="18" rx="2"/>
  </g>

  <!-- Spacer for layout -->
  <g id="Spacer">
    <rect fill="none" x="0" y="156" width="64" height="8"/>
  </g>

  <!-- Frame -->
  <g id="Frame">
    <rect class="bg" x="2" y="168" width="28" height="24"/>
    <rect class="border" x="2" y="168" width="28" height="24"/>
  </g>

  <!-- GroupBox -->
  <g id="GroupBox">
    <rect class="bg" x="34" y="168" width="28" height="24"/>
    <rect class="border" x="34" y="168" width="28" height="24"/>
  </g>

  <!-- Slider Groove -->
  <g id="Slider-groove">
    <rect class="scrollbar-bg" x="2" y="198" width="20" height="4" rx="2"/>
  </g>

  <!-- Slider Handle -->
  <g id="Slider-handle">
    <rect class="bg" x="26" y="194" width="8" height="12" rx="2"/>
    <rect class="border" x="26" y="194" width="8" height="12" rx="2"/>
  </g>

  <!-- SpinBox Up Button -->
  <g id="SpinUp">
    <rect class="bg" x="50" y="194" width="12" height="8" rx="1"/>
    <rect class="border" x="50" y="194" width="12" height="8" rx="1"/>
  </g>

  <!-- SpinBox Down Button -->
  <g id="SpinDown">
    <rect class="bg" x="50" y="204" width="12" height="8" rx="1"/>
    <rect class="border" x="50" y="204" width="12" height="8" rx="1"/>
  </g>

  <!-- Dial -->
  <g id="Dial">
    <circle class="bg" cx="9" cy="235" r="8"/>
    <circle class="border" cx="9" cy="235" r="8" fill="none"/>
  </g>

  <!-- ProgressBar -->
  <g id="ProgressBar">
    <rect class="bg" x="26" y="227" width="20" height="8" rx="2"/>
    <rect class="border" x="26" y="227" width="20" height="8" rx="2"/>
    <rect class="scrollbar" x="28" y="229" width="10" height="4" rx="1"/>
  </g>

  <!-- Header -->
  <g id="Header">
    <rect class="bg" x="50" y="227" width="12" height="8"/>
    <rect class="border" x="50" y="227" width="12" height="8"/>
  </g>

  <!-- Splitter -->
  <g id="Splitter">
    <rect fill="#bf5fff" opacity="0.2" x="2" y="245" width="4" height="20"/>
  </g>

  <!-- TreeView Item -->
  <g id="TreeView-item">
    <rect class="bg" x="10" y="245" width="16" height="20" rx="2"/>
    <rect class="border" x="10" y="245" width="16" height="20" rx="2"/>
  </g>

  <!-- TreeView Item Selected -->
  <g id="TreeView-item-selected">
    <rect fill="rgba(0,245,255,0.15)" x="32" y="245" width="16" height="20" rx="2"/>
    <rect class="border-focus" x="32" y="245" width="16" height="20" rx="2"/>
  </g>

  <!-- ItemView Item -->
  <g id="ItemView-item">
    <rect class="bg" x="52" y="245" width="10" height="20" rx="2"/>
    <rect class="border" x="52" y="245" width="10" height="20" rx="2"/>
  </g>

  <!-- Dock Widget -->
  <g id="DockWidget">
    <rect class="bg" x="2" y="271" width="20" height="20"/>
    <rect class="border" x="2" y="271" width="20" height="20"/>
  </g>

  <!-- Tooltip -->
  <g id="Tooltip">
    <rect fill="#12132a" x="26" y="271" width="20" height="14" rx="2"/>
    <rect class="border" x="26" y="271" width="20" height="14" rx="2"/>
  </g>

  <!-- IndicatorCheckBox -->
  <g id="IndicatorCheckBox">
    <rect class="bg" x="50" y="271" width="12" height="12" rx="1"/>
    <rect class="border" x="50" y="271" width="12" height="12" rx="1"/>
  </g>

  <!-- IndicatorRadioButton -->
  <g id="IndicatorRadioButton">
    <circle class="bg" cx="35" cy="295" r="6"/>
    <circle class="border" cx="35" cy="295" r="6" fill="none"/>
  </g>

  <!-- MessageBox -->
  <g id="MessageBox">
    <rect class="bg" x="2" y="307" width="28" height="20" rx="2"/>
    <rect class="border" x="2" y="307" width="28" height="20" rx="2"/>
  </g>

  <!-- Dialog -->
  <g id="Dialog">
    <rect class="bg" x="34" y="307" width="28" height="20" rx="2"/>
    <rect class="border" x="34" y="307" width="28" height="20" rx="2"/>
  </g>

  <!-- Window -->
  <g id="Window">
    <rect class="bg" x="2" y="333" width="28" height="20" rx="2"/>
    <rect class="border" x="2" y="333" width="28" height="20" rx="2"/>
  </g>

  <!-- StatusBar -->
  <g id="StatusBar">
    <rect fill="transparent" x="34" y="333" width="28" height="20"/>
  </g>

</svg>
