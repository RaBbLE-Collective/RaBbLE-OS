# xdg-desktop-portal-gnome starts in settings-only mode under niri ("Non-compatible display server"),
# so it exposes no FileChooser and every Open Folder / Open File dialog silently fails.
# Route dialogs to the GTK backend; keep gnome for settings and screencast.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.FileChooser=gtk;
org.freedesktop.impl.portal.AppChooser=gtk;
org.freedesktop.impl.portal.Print=gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
